<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홈루덴스 업무지원 포털</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!--
  카톡·문자 미리보기(2026-10-07). 이게 없으면 카카오가 페이지에서 아무 그림이나
  골라 가는데, 홈화면 아이콘(정사각형)을 가로 칸에 꽉 차게 잘라 넣어 H 귀퉁이만
  크게 보였다. 그림은 tools/make_og.py 가 만든다. 주소는 절대 주소여야 카카오가 읽는다.
  그림을 바꾸면 파일 이름의 판 번호를 올리고, 카카오 캐시를 지운다
  (developers.kakao.com/tool/clear/og — CLAUDE.md 「카카오 캐시」).
-->
<meta property="og:type" content="website">
<meta property="og:site_name" content="홈루덴스">
<meta property="og:title" content="홈루덴스 업무지원 포털">
<meta property="og:description" content="홈루덴스 직원 전용 업무지원 포털입니다.">
<meta property="og:url" content="https://portal.homeludens.co.kr/">
<meta property="og:image" content="https://portal.homeludens.co.kr/og-portal-v2.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="description" content="홈루덴스 직원 전용 업무지원 포털입니다.">

<!--
  폰 홈화면에 깔리는 앱 껍데기.

  ── 왜 이런 것이 필요한가
  포털 자체는 Apps Script 웹 앱이고, 구글은 그것을 구글 페이지 안의 액자에
  넣어서 보여준다. 바깥 껍데기가 구글 것이라 우리가 아이콘도 이름도 붙일 수
  없다. 그래서 우리 주소에 껍데기를 하나 두고 그 안에 포털을 넣는다.
  아이콘·이름·주소창 없는 화면은 전부 이 파일이 만든다.

  ── 이 파일에 진짜 내용은 없다
  화면에 보이는 것은 전부 액자 안 포털이 그린다. 여기에 문구를 적기 시작하면
  포털과 껍데기 두 곳을 같이 고쳐야 하고, 언젠가 둘이 어긋난다.

  ── https://script.google.com/macros/s/AKfycby8G1Pd0NGBf1LyD7J3o3B6gUJqkIsVhM4crKOWYBD51gHVUHYwMZ8vNbZgwXGYV7pvvQ/exec
  포털 주소는 여기 박아 두지 않는다. `tools/build_pwa.sh` 가 배포할 때
  채워 넣는다. 링크만 있으면 열리는 주소라 저장소에 두지 않기로 했다.
-->

<link rel="manifest" href="manifest.webmanifest">
<!--
  위아래 안전영역(노치·홈바)에 깔리는 색. 포털이 어두운 화면일 때 여기가
  밝으면 앱 위아래에 흰 띠가 남는다. 포털의 배경색과 같은 값을 쓴다.
-->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5f3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#211f1c">

<!-- 아이폰은 manifest 를 안 본다. 아래 셋이 아이폰 몫이다. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="업무지원 포털">
<!--
  아이콘 주소에 붙은 -v12 는 판 번호다. iOS 는 홈화면 아이콘을 주소로 캐시해서,
  같은 주소로 그림만 바꾸면 앱을 지웠다 다시 담아도 옛 아이콘이 그대로 나온다.
  2026-09-05 에 그 때문에 두 번 헛고쳤다. **아이콘 그림을 바꾸면 이 번호를 올린다**
  (manifest.webmanifest·sw.js·tools/build_pwa.sh 의 같은 이름도 함께).
-->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180-v12.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152-v12.png">
<link rel="icon" href="icon-192-v12.png">

<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #f7f5f3;   /* 포털의 --bg 와 같은 값 */
    /* 노치·홈바에 화면이 가리지 않게 한다. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
    overscroll-behavior: none;
  }
  iframe { display: block; border: 0; width: 100%; height: 100%; }

  /*
    포털이 뜨기 전 잠깐 보이는 화면. 흰 판만 있으면 앱이 멈춘 줄 안다.

    반드시 걷어내야 한다. position:fixed 는 액자보다 위에 그려지므로,
    두면 포털이 다 떴는데도 이 화면이 덮은 채로 남는다. 처음에 그렇게
    두었다가 「여는 중」 에서 멈춘 앱이 되었다.
  */
  #wait {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    color: #7b7166; background: #f7f5f3;
  }
  /*
   * 배경이 투명한 심볼을 쓴다(symbol-mono.png). 흰 배경이 있는 아이콘을 아래
   * 어두운 모드에서 반전시키면 배경이 순검정이 되어, 따뜻한 바탕 위에 검은
   * 네모가 뜬다 — 로고 둘레에 그림자가 낀 것처럼 보인다.
   */
  #wait img { width: 64px; height: 64px; margin-bottom: 14px; }
  #wait div { text-align: center; }
  /* display:grid 가 브라우저의 hidden 처리를 이기므로 직접 적어 준다. */
  #wait[hidden] { display: none; }

  /*
    알림 허락을 받는 아래쪽 판. 포털(액자 안)에서 「저장」 을 누르면 뜬다.
    아이폰은 이 페이지에서 사람이 직접 누른 단추로만 허락 창을 열어 주므로,
    한 번 더 누르게 하는 수밖에 없다.
  */
  #ask {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
    background: #fffdfb; color: #2b2622; border-top: 1px solid #e4ddd5;
    box-shadow: 0 -8px 24px rgba(0,0,0,.08);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  #ask[hidden] { display: none; }
  #ask p { margin: 0 0 14px; }
  #ask .btns { display: flex; gap: 10px; justify-content: flex-end; }
  #ask button {
    font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 18px;
    border: 1px solid #d9d0c6; background: transparent; color: inherit;
  }
  #ask button.go { background: #2b2622; color: #fff; border-color: #2b2622; }

  /* 어두운 화면일 때. 값은 포털 Style.html 의 다크 모드 --bg 와 같다. */
  @media (prefers-color-scheme: dark) {
    html, body { background: #211f1c; }
    #wait { background: #211f1c; color: #a69a8f; }
    #wait img { filter: invert(1); }
    #ask { background: #2a2724; color: #eee6dd; border-top-color: #3a3530; }
    #ask button { border-color: #4a443d; }
    #ask button.go { background: #eee6dd; color: #211f1c; border-color: #eee6dd; }
  }
</style>
</head>
<body>

<div id="wait"><div><img src="symbol-mono.png" alt=""><br>포털을 여는 중…</div></div>
<iframe id="portal" title="홈루덴스 업무지원 포털"
        allow="clipboard-write; downloads"></iframe>
<div id="ask" hidden role="dialog" aria-label="알림 허용">
  <p><b>상담실 예약 알림</b><br>새 예약을 이 폰으로 받으려면 알림을 허용해 주세요.</p>
  <div class="btns"><button id="ask-no">나중에</button><button id="ask-go" class="go">허용</button></div>
</div>

<script>
/*
 * 주소에 붙어 온 것을 그대로 포털에 넘긴다.
 *
 * 로그인 메일의 링크가 이 껍데기로 온다(`?login=…`). 그것을 안쪽 포털에
 * 그대로 넘겨야 로그인이 앱 안에서 끝난다. 넘기지 않으면 앱은 영영
 * 로그인 화면만 보여준다.
 *
 * 넘기고 나서 껍데기 주소에서는 지운다. 홈화면 아이콘은 이 주소를 기억하는데,
 * 일회용 로그인 토큰이 거기 남아 있으면 다음에 열 때마다 이미 써 버린 토큰으로
 * 로그인을 시도하게 된다.
 */
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycby8G1Pd0NGBf1LyD7J3o3B6gUJqkIsVhM4crKOWYBD51gHVUHYwMZ8vNbZgwXGYV7pvvQ/exec';
  var q = location.search || '';
  // 속도 표시(#t)는 주소를 정리하기 전에 읽어 둔다 — 아래에서 주소창을 비운다.
  var wantTiming = /(^|[#&])t\b/.test(location.hash);
  var frame = document.getElementById('portal');
  var wait = document.getElementById('wait');

  /*
   * 기다림 화면은 포털이 「다 그렸다」 고 알려 올 때 걷는다(homeludens-ready).
   *
   * 액자의 load 로 걷으면 안 된다(2026-10-05 에 고쳤다). load 는 우리 페이지가
   * 막 도착한 순간이라, 그 뒤 홈 데이터를 기다리는 3~4초 동안 하얀 빈 판이
   * 보였다. 직원 눈에는 앱이 멈춘 것이다.
   *
   * 다만 load 뒤에도 신호가 끝내 안 오면(옛 버전 포털이거나 메시지가 막혔거나)
   * 12초 뒤에 걷는다. 이 화면은 position:fixed 라 액자를 덮고 있다 — 걷지
   * 않으면 다 뜬 포털이 「여는 중…」 밑에 갇힌다.
   */
  var loaded = false;
  var loadedAt = 0;
  function hideWait() {
    if (wait.hidden) return;
    wait.hidden = true;
    showTiming();
  }
  frame.addEventListener('load', function () {
    loaded = true;
    loadedAt = performance.now();
    setTimeout(hideWait, 12000);
  });

  /*
   * 폰에서 속도를 재는 표시(2026-10-05). 주소 끝에 #t 를 붙여 열 때만 뜬다.
   *
   * 폰의 실제 속도는 그 폰을 든 사람만 잴 수 있다 — 개발 PC 의 숫자는 신호가
   * 좋은 와이파이 숫자다. 그래서 껍데기가 직접 재서 보여 준다. 주소창의 ?
   * 뒤는 포털로 넘어가므로(로그인 링크가 그 길을 쓴다) 표시는 # 로 받는다.
   * 남이 흉내내도 숫자 한 줄이 보일 뿐이다.
   */
  function showTiming() {
    if (!wantTiming) return;
    var now = performance.now();
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));' +
      'z-index:9;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.75);color:#fff;' +
      'font:13px/1.4 -apple-system,sans-serif';
    box.textContent = '홈까지 ' + (now / 1000).toFixed(1) + '초 · 페이지 도착 ' +
      (loadedAt / 1000).toFixed(1) + '초';
    document.body.appendChild(box);
  }

  // 액자가 끝내 안 뜨는 경우(신호가 끊겼거나 구글이 막았거나)에는 무슨 일인지
  // 적어 준다. 「여는 중…」 이 영영 떠 있으면 무엇이 잘못됐는지조차 알 수 없다.
  setTimeout(function () {
    if (wait.hidden || loaded) return;
    wait.querySelector('div').innerHTML =
      '포털을 열지 못했습니다.<br>신호를 확인하고 다시 열어 주세요.';
  }, 20000);

  /*
   * 껍데기 안이라는 표시. 포털은 이것을 보고 「이 주소를 즐겨찾기에 추가하세요」
   * 안내를 감춘다 — 앱에서는 틀린 안내이고(즐겨찾기할 주소는 껍데기 쪽이다),
   * 그 안내가 세션 토큰을 화면에 찍는다.
   *
   * 이 표시로는 아무 권한도 주지 않는다. 남이 흉내내도 안내 한 줄이 안 보일
   * 뿐이다. 권한을 이런 값에 걸면 안 된다.
   */
  /*
   * 로그인을 기억한다.
   *
   * 세션은 30일짜리인데 껍데기가 그것을 들고 있지 않아서, 앱을 열 때마다
   * 로그인 화면이 나왔다. 포털 쪽에 맡길 수가 없다 — 구글이 포털을 매번
   * 다른 하위 도메인에 띄워서 거기 저장한 것은 다음에 사라진다. 껍데기
   * 주소는 고정이라 여기서는 남는다.
   *
   * 주소로 들어온 값(로그인 링크)이 있으면 그쪽이 먼저다. 방금 누른 것이
   * 들고 있던 것보다 새롭다.
   */
  var KEY = 'homeludens.session';
  var saved = '';
  try { saved = localStorage.getItem(KEY) || ''; } catch (e) {}

  var qs = q;
  if (!qs && saved) qs = '?s=' + encodeURIComponent(saved);
  frame.src = EXEC + (qs ? qs + '&app=1' : '?app=1');

  /*
   * 포털이 로그인 상태를 알려 준다. 빈 값이면 그 세션이 죽었다는 뜻이라 지운다.
   *
   * 보낸 곳이 우리 포털인지 확인한다 — 액자 안에 다른 페이지가 들어와
   * 아무 값이나 넣어 두는 일을 막는다.
   *
   * ★ googleusercontent 도 받는다(2026-09-16 에 고쳤다). 액자가 두 겹이라
   *   우리 화면은 script.google.com 이 아니라 구글이 따로 띄우는 샌드박스
   *   주소에서 돈다 — 보내는 쪽 주소가 그것이다. script.google.com 만
   *   받도록 두었더니 메시지가 통째로 버려졌고, 껍데기는 세션을 한 번도
   *   저장하지 못했다. 증상은 「앱을 열 때마다 로그인」 으로만 보였다.
   *
   *   하위 도메인이 매번 바뀌므로 정확히 못 박을 수가 없다. 대신 이 액자에
   *   들어오는 것은 우리가 src 로 지정한 포털뿐이라, 구글이 띄운 것까지만
   *   받아도 아무나 값을 넣지는 못한다.
   */
  function fromPortal(origin) {
    if (origin === new URL(EXEC).origin) return true;
    return /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.googleusercontent\.com$/.test(origin);
  }

  window.addEventListener('message', function (ev) {
    if (!fromPortal(ev.origin)) return;
    var d = ev.data;
    if (!d) return;
    if (d.type === 'homeludens-ready') return hideWait();
    if (d.type === 'homeludens-push-hello') return pushReply(ev);
    if (d.type === 'homeludens-push-ask') return pushAsk(ev, d.key);
    if (d.type !== 'homeludens-session') return;
    try {
      if (d.token) localStorage.setItem(KEY, d.token);
      else localStorage.removeItem(KEY);
    } catch (e) {}
  });

  /*
   * 예약 알림.
   *
   * 알림을 받는 것은 이 껍데기다. 포털은 구글이 매번 다른 주소에 띄워서
   * 거기서 구독하면 다음에 찾을 수 없다. 포털은 사무실을 고르고 서버에
   * 적는 일만 하고, 폰의 허락과 구독은 여기서 만든다.
   *
   * 구독을 서버에 적는 것도 포털이 한다. 로그인한 사람이 누구인지는 포털이
   * 알고, 이 껍데기가 서버를 직접 부르면 그 확인을 여기서 한 번 더 해야 한다.
   *
   * 대답은 물어 온 창(ev.source)에, 물어 온 주소(ev.origin)로만 보낸다.
   * 구독 주소를 아는 사람은 이 폰에 알림을 밀어 넣을 수 있다.
   */
  function pushSupported() {
    return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  }

  function pushReason() {
    var ios = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = navigator.standalone === true ||
                     (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    return ios && !standalone ? 'ios-browser' : 'unsupported';
  }

  function b64u(buf) {
    var s = '', b = new Uint8Array(buf);
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function unb64u(s) {
    var t = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (t.length % 4) t += '=';
    var bin = atob(t), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function currentSub() {
    return navigator.serviceWorker.ready.then(function (reg) {
      return reg.pushManager.getSubscription().then(function (sub) { return { reg: reg, sub: sub }; });
    });
  }

  function pushState(extra) {
    var base = { type: 'homeludens-push-state' };
    if (!pushSupported()) {
      base.supported = false; base.reason = pushReason();
      return Promise.resolve(base);
    }
    base.supported = true;
    base.permission = Notification.permission;
    return currentSub().then(function (x) {
      // 허락이 거둬졌는데 구독이 남아 있으면 없는 것으로 친다. 서버에 적어 봐야 안 간다.
      if (x.sub && Notification.permission === 'granted') {
        var j = x.sub.toJSON();
        base.endpoint = j.endpoint; base.p256dh = j.keys.p256dh; base.auth = j.keys.auth;
      }
      for (var k in (extra || {})) base[k] = extra[k];
      return base;
    });
  }

  function pushReply(ev, extra) {
    pushState(extra).then(function (s) {
      try { ev.source.postMessage(s, ev.origin); } catch (e) {}
    });
  }

  var ask = document.getElementById('ask');
  var asking = null;

  function pushAsk(ev, key) {
    if (!pushSupported() || !key) return pushReply(ev);
    currentSub().then(function (x) {
      // 이미 같은 열쇠로 구독해 두었으면 묻지 않는다.
      var have = x.sub && x.sub.options && x.sub.options.applicationServerKey;
      if (x.sub && Notification.permission === 'granted' &&
          (!have || b64u(have) === key)) return pushReply(ev);
      asking = { ev: ev, key: key };
      ask.hidden = false;
    });
  }

  document.getElementById('ask-no').addEventListener('click', function () {
    ask.hidden = true;
    if (asking) pushReply(asking.ev, { cancelled: true });
    asking = null;
  });

  document.getElementById('ask-go').addEventListener('click', function () {
    ask.hidden = true;
    var a = asking;
    asking = null;
    if (!a) return;
    // requestPermission 은 이 누름 안에서 바로 불러야 한다. 앞에 다른 기다림을 끼우면
    // 아이폰이 사람이 누른 것으로 치지 않는다.
    Promise.resolve(Notification.requestPermission())
      .then(function (p) {
        if (p !== 'granted') return pushReply(a.ev);
        return currentSub().then(function (x) {
          // 열쇠가 바뀐 옛 구독은 새 열쇠로 다시 만들 수 없다. 먼저 푼다.
          return (x.sub ? x.sub.unsubscribe() : Promise.resolve()).then(function () {
            return x.reg.pushManager.subscribe({
              userVisibleOnly: true, applicationServerKey: unb64u(a.key)
            });
          });
        }).then(function () { pushReply(a.ev); });
      })
      .catch(function (e) { pushReply(a.ev, { error: String(e && e.message || e) }); });
  });

  if (q) {
    history.replaceState(null, '', location.pathname);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {
      /* 안 되면 앱으로 깔리지 않을 뿐, 포털은 그대로 열린다. */
    });
  }
})();
</script>
