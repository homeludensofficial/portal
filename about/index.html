<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!--
    폰에서 열리는 화면이다. viewport 가 없으면 브라우저가 폭을 980px 로 잡고
    데스크톱 화면을 축소해 보여 준다 — 글자가 깨알같이 작아진다.

    Apps Script 로 열 때는 서버가 붙여 주지만(WebApp.gs 의 addMetaTag), 정적
    한 장으로 뽑을 때는 그 서버가 없다. 여기 적어 두면 양쪽 다 맞는다.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
    카카오톡·문자로 주소를 보내면 받는 쪽에 뜨는 미리보기.
    이 태그들이 없으면 「미리보기가 없습니다」 만 뜨고, 고객은 무엇인지 모르는
    링크를 눌러야 한다. 직원이 고객에게 보내는 주소라 이게 첫인상이다.

    그림은 회사 홈페이지가 쓰는 공유용 이미지 그대로다(1200×627). 이 화면의
    머리 사진은 세로로 길어서 미리보기 칸에서 위아래가 잘린다.
  -->
  <title>홈루덴스 회사소개</title>
  <meta name="description" content="즐거움을 만들어가는 사람들이 디자인하는 공간. 건설업 면허와 하자보증, 8년 동안 쌓아 온 기준을 소개합니다.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="홈루덴스">
  <meta property="og:title" content="공간을 넘어 삶을 디자인합니다">
  <meta property="og:description" content="즐거움을 만들어가는 사람들이 디자인하는 공간. 건설업 면허와 하자보증, 8년 동안 쌓아 온 기준을 소개합니다.">
  <meta property="og:image" content="https://cdn.imweb.me/upload/S202410021f65846b53dd9/55820a69226dd.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="627">
  <meta name="twitter:card" content="summary_large_image">
  <style>
/*
 * 포털 스타일.
 *
 * 색은 전부 :root 의 변수로만 정의한다. 다크 모드에서 변수만 바꾸면
 * 되도록 해서, 나중에 색을 하나 추가할 때 두 곳을 고치는 일을 없앤다.
 */

/*
 * ── 홈루덴스 브랜드 팔레트 ──────────────────────────────
 *   Primary    #46413a  Deep Espresso
 *   Secondary  #dbd6d1  White Sand / #a69a8f Taupe Brown
 *              #11283f  Deep Marine Blue / #5b0f11 Deep Burgundy
 *   Accent     #ecb85c  Golden Sand / #627e49 Olive Moss
 *
 * 브랜드 색을 화면에 그대로 쓰면 대비가 모자라는 자리가 생긴다.
 * 그래서 넓은 면(배경·선·강조 바탕)에는 원색을 쓰고, 글자에는 같은 색을
 * 어둡게/밝게 조정한 값을 쓴다. 읽히지 않는 브랜드 색은 브랜드가 아니다.
 */
:root {
  /* 원색 (넓은 면·장식용) */
  --brand:     #46413a;   /* Deep Espresso */
  --sand:      #dbd6d1;   /* White Sand */
  --taupe:     #a69a8f;   /* Taupe Brown */
  --navy:      #11283f;   /* Deep Marine Blue */
  --burgundy:  #5b0f11;   /* Deep Burgundy */
  --gold:      #ecb85c;   /* Golden Sand */
  --olive:     #627e49;   /* Olive Moss */

  /* 화면용 */
  --bg: #f7f5f3;
  --surface: #ffffff;
  --surface-2: #eeeae6;
  --text: #46413a;
  --muted: #7b7166;          /* Taupe Brown 을 글자용으로 어둡게 */
  --line: #dbd6d1;
  --accent: #627e49;         /* Olive Moss */
  --accent-soft: #ecf1e5;
  --info: #11283f;
  --info-soft: #e4e9ef;
  --warn: #a9761b;           /* Golden Sand 를 글자용으로 어둡게 */
  --warn-soft: #fbf1de;
  --danger: #8d2225;         /* Deep Burgundy 를 글자용으로 밝게 */
  --danger-soft: #f8e8e8;
  --on-accent: #ffffff;
  /* 머리표 칩. 밝은 화면에서는 에스프레소 바탕에 흰 글자, 어두운 화면에서는 뒤집는다.
     한 색을 양쪽에 그대로 쓰면 어두운 화면에서 칩이 배경에 묻힌다. */
  --chip: #46413a;
  --on-chip: #ffffff;
  /* 조직도 바탕. 원본이 모눈 위에 그려진 한 장이라, 화면에서도 종이 한 장으로
     보이게 한다. 격자는 아주 옅어야 한다 — 눈에 띄면 사람 이름과 다툰다. */
  --org-paper: #f2f0ec;
  --org-grid: rgba(70, 65, 58, .055);
  /*
   * 일정표를 이미지로 저장할 때 쓰는 색.
   *
   * 화면 색(--surface 등)을 그대로 쓰지 않는 이유는 하나다 — 다크 모드로
   * 보던 사람이 저장하면 검은 일정표가 나오고, 그게 전체공지에 올라간다.
   * 공지에 붙는 그림은 누가 어떤 화면으로 저장했든 같아야 한다.
   *
   * 그래서 이 값들은 아래 다크 모드 블록에서 뒤집지 않는다. 색을 고칠 일이
   * 생기면 위의 화면용 값과 여기를 같이 본다.
   */
  --img-paper: #f1efec;
  --img-cell: #ffffff;
  --img-text: #2f2b26;
  --img-muted: #6f665c;
  --img-line: #ddd8d2;
  --img-chip: #262320;
  --img-on-chip: #ffffff;
  --img-sun: #b3383b;
  --img-sat: #2f5b8f;
  --img-red-bg: #fbe4e4;   --img-red-fg: #8d2225;
  --img-yellow-bg: #fbf1de;    --img-yellow-fg: #8a5f14;
  --img-blue-bg: #e4ebf3;  --img-blue-fg: #1d3f5f;
  --img-green-bg: #e8efe0;   --img-green-fg: #4d6a37;
  --img-gray-bg: #efece8;  --img-gray-fg: #6f665c;

  --radius: 12px;
  --shadow: 0 1px 2px rgba(70, 65, 58, .07), 0 4px 14px rgba(70, 65, 58, .06);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #211f1c;           /* Deep Espresso 계열로 어둡게 */
    --surface: #2b2925;
    --surface-2: #37342f;
    --text: #ece8e3;
    --muted: #a69a8f;        /* Taupe Brown 은 어두운 배경에서 그대로 잘 읽힌다 */
    --line: #423e38;
    --accent: #93b072;       /* Olive Moss 를 밝게 */
    --accent-soft: #2f3a26;
    --info: #8fb0d6;
    --info-soft: #23303f;
    --warn: #ecb85c;         /* Golden Sand 는 어두운 배경에 그대로 */
    --warn-soft: #3a2e1d;
    --danger: #d98a8c;
    --danger-soft: #3a2020;
    --on-accent: #1e2a15;
    --chip: #dbd6d1;         /* White Sand — 어두운 배경에서는 칩을 밝게 뒤집는다 */
    --on-chip: #211f1c;
    --org-paper: #262420;
    --org-grid: rgba(219, 214, 209, .05);
    --shadow: 0 1px 2px rgba(0, 0, 0, .32), 0 4px 14px rgba(0, 0, 0, .26);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
               "Pretendard", "Malgun Gothic", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 940px; margin: 0 auto; padding: 0 20px 72px; }

/* 조직도 화면일 때만 본문을 넓게 쓴다. 940px 안에 가두면 원본 한 장이
   손톱만 해진다. 다른 화면은 글이라 넓힐수록 읽기 나빠지므로 그대로 둔다. */
body.org-wide .wrap { max-width: 1360px; }

/* ── 헤더 ───────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.hdr { max-width: 940px; margin: 0 auto; padding: 12px 20px;
       display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em;
         cursor: pointer; white-space: nowrap; }
.brand span { color: var(--accent); }
.hdr .spacer { flex: 1 1 auto; }
.who { font-size: 13px; color: var(--muted); white-space: nowrap; }
.who b { color: var(--text); font-weight: 600; }

#search {
  flex: 1 1 200px; min-width: 160px;
  padding: 8px 12px; font-size: 14px; font-family: inherit;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--text);
}
#search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

/* ── 네비게이션 ─────────────────────────────────────── */
/*
 * 메뉴가 한 줄을 넘으면 넘친 것을 줄로 내린다.
 *
 * 예전에는 넓은 화면에서도 가로 스크롤이었다. 그런데 스크롤바를 숨겨 두어서,
 * 밀려난 메뉴가 있다는 표시가 아무 데도 없었다 — 「자주 묻는 질문」 이 물음표
 * 하나만 남고 사라져 있었고, 아무도 그것이 스크롤인 줄 몰랐다.
 *
 * 좁은 화면(휴대폰)에서는 가로 스크롤을 그대로 둔다. 아홉 개가 네 줄로
 * 쌓이면 첫 화면이 메뉴로 덮인다. 그 폭에서는 옆으로 미는 것이 익숙하다.
 */
nav { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 0 0; }
@media (max-width: 640px) {
  nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
}
nav a {
  /* 메뉴 이름을 줄여(「사무실」·「상담 예약」·「FAQ」) 한 줄에 들어가므로 여백은
     넉넉히 둔다. 항목을 더 늘려 넘치면 여백을 깎지 말고 이름을 줄인다 —
     여기서 9px 까지 내려 봤는데 알약끼리 붙어 한 항목의 끝이 안 보였다. */
  padding: 6px 12px; border-radius: 999px; font-size: 14px;
  color: var(--muted); text-decoration: none; white-space: nowrap;
}
nav a:hover { background: var(--surface-2); color: var(--text); }
nav a.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }

/* ── 공통 ───────────────────────────────────────────── */
h1 { font-size: 24px; letter-spacing: -.02em; margin: 28px 0 6px; }
h2 { font-size: 18px; letter-spacing: -.01em; margin: 32px 0 12px; }
.lead { color: var(--muted); margin: 0 0 20px; }
/* 홈에는 안내 문구가 없다. 인사와 바로가기 사이를 띄우던 것이 그 문구였으므로,
   그만큼을 인사에 옮겨 준다. 안 그러면 바로가기가 인사에 달라붙는다. */
#v-home h1 { margin-bottom: 22px; }
.view { display: none; }
.view.on { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
}
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

.badge {
  display: inline-block; font-size: 11.5px; font-weight: 600;
  padding: 2px 8px; border-radius: 999px; vertical-align: middle;
}
.badge.todo { background: var(--warn-soft); color: var(--warn); }
.badge.admin { background: var(--info-soft); color: var(--info); }
.badge.wait { background: var(--warn-soft); color: var(--warn); }
.badge.ok { background: var(--accent-soft); color: var(--accent); }
.badge.no { background: var(--danger-soft); color: var(--danger); }
.badge.warn { background: var(--danger-soft); color: var(--danger); }

button {
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--text);
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); }

input[type=text], input[type=email], textarea {
  font: inherit; width: 100%; padding: 9px 12px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--text);
}
textarea { resize: vertical; min-height: 72px; }

/* ── 요약 스트립 ────────────────────────────────────── */
.stats { display: grid; gap: 10px; margin-bottom: 14px;
         grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow);
}
.stat .ico { font-size: 20px; line-height: 1; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.stat .mini { height: 5px; border-radius: 999px; background: var(--surface-2);
              overflow: hidden; margin-top: 5px; }
.stat .mini > i { display: block; height: 100%; background: var(--accent); }

/* ── 홈 카드 ────────────────────────────────────────── */
.hub { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.hub button {
  display: flex; gap: 14px; align-items: flex-start;
  text-align: left; padding: 20px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--shadow); font-weight: 400;
  transition: transform .12s, border-color .12s;
}
.hub button:hover { border-color: var(--accent); transform: translateY(-2px); }
.hub .em { font-size: 28px; line-height: 1.1; flex: 0 0 auto; }
.hub .q { font-size: 13px; color: var(--muted); }
.hub .t { font-size: 17px; font-weight: 700; letter-spacing: -.01em; margin-top: 4px; }

/* ── 목록 ───────────────────────────────────────────── */
.item { border-bottom: 1px solid var(--line); padding: 14px 0; }
.item:last-child { border-bottom: 0; }
.item .t { font-weight: 600; }
.item .b { color: var(--muted); font-size: 14px; white-space: pre-line; margin-top: 2px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row .spacer { flex: 1 1 auto; }

/* ── 분류 묶음 ──────────────────────────────────────── */
.group {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 6px 20px 14px; margin-bottom: 12px;
}
.group-h {
  display: flex; align-items: baseline; gap: 10px;
  font-size: 15px; font-weight: 700; letter-spacing: -.01em;
  padding: 14px 0 10px; border-bottom: 2px solid var(--accent-soft);
  margin-bottom: 4px;
}
.group-h .small { margin-left: auto; }

.doc-group { margin-bottom: 26px; }
.doc-group .group-h { margin-bottom: 12px; }

/* ── 검색 · 질문 · 사람 ─────────────────────────────── */
/* 찾은 말에 표시를 남긴다. 눈이 먼저 가야 할 곳이 어디인지 알려준다. */
mark { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* 질문은 접어 두고 제목만 보인다. 스무 개가 넘어가면 그래야 훑을 수 있다. */
.qa { border-bottom: 1px solid var(--line); padding: 4px 0; }
.qa:last-child { border-bottom: 0; }
.qa > summary {
  cursor: pointer; font-weight: 600; padding: 11px 0; list-style: none;
  display: flex; align-items: center; gap: 8px;
}
.qa > summary::-webkit-details-marker { display: none; }
.qa > summary::before { content: '＋'; color: var(--muted); font-weight: 400; }
.qa[open] > summary::before { content: '−'; }
.qa[open] > summary { color: var(--accent); }
.qa .b {
  color: var(--muted); font-size: 14px; white-space: pre-line;
  padding: 0 0 14px 22px; line-height: 1.75;
}

.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; padding: 12px 0 4px; }
.person { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.person .t { font-weight: 600; }
.person a { color: var(--accent); text-decoration: none; }
.person a:hover { text-decoration: underline; }

/* 한 화면 안에서 덩어리를 가르는 소제목(구성원 화면의 조직도 / 부서별 연락처). */
.sec-h {
  font-size: 16px; font-weight: 700; letter-spacing: -.01em;
  margin: 30px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.sec-h:first-of-type { margin-top: 22px; }

/* ── 조직도 ─────────────────────────────────────────────
 * 원본 조직도(A3 한 장)를 그대로 옮긴다. 모눈 바탕 위에 제목을 얹고,
 * 그룹 머리표(칩) → 팀 카드 → 사람 상자 순으로 내려간다.
 *
 * 원본은 폭이 2000px 인 그림이다. 좁은 화면에서 팀 카드를 아래로 접으면
 * 읽기는 편해지지만 원본과 다른 그림이 된다 — 조직도는 전체 모양 자체가
 * 정보라서(어느 그룹이 큰지, 팀이 몇 개인지) 접는 순간 그게 사라진다.
 * 그래서 접지 않고, 좁아지면 가로로 밀어서 본다.
 */
.org-sheet {
  background: var(--org-paper);
  background-image:
    linear-gradient(var(--org-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--org-grid) 1px, transparent 1px);
  background-size: 28px 28px;
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 34px 30px 26px; overflow-x: auto;
}
.org-canvas { min-width: max-content; margin: 0 auto; }

.org-title { text-align: center; margin: 0 0 30px; }
.org-title b { font-size: 25px; font-weight: 800; letter-spacing: -.02em; }
.org-title span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 6px; }

/* 그룹이 하나뿐인 줄은 가운데, 여러 그룹이 한 줄에 서면 좌우로 벌린다.
   원본에서 Growth Lab 과 Sales Team 이 나란히 서 있는 그 줄이다. */
.org-row {
  display: flex; align-items: flex-start; justify-content: center;
  gap: 46px; margin-bottom: 34px;
}
.org-row:last-child { margin-bottom: 0; }

.org-group-t { text-align: center; margin-bottom: 12px; }
.org-group-h {
  display: inline-block; background: var(--chip); color: var(--on-chip);
  font-size: 14px; font-weight: 700; letter-spacing: -.01em;
  border-radius: 999px; padding: 6px 16px; white-space: nowrap;
}
.org-group-h em { font-style: normal; font-weight: 400; opacity: .78; }

/* 팀은 세로 기둥이다. 위를 맞춰 세워야 원본처럼 읽힌다. */
.org-teams { display: flex; align-items: flex-start; justify-content: center; gap: 12px; }

/* 한 명짜리 팀은 옆으로 늘어세우면 빈자리만 커진다. 원본처럼 위아래로
   쌓아 한 기둥으로 묶는다(재무팀·스타일링팀). */
.org-stack { display: flex; flex-direction: column; gap: 12px; }

.org-team {
  background: var(--surface); border: 1.5px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 12px; min-width: 132px;
}
.org-team-h {
  display: inline-block; background: var(--chip); color: var(--on-chip);
  font-size: 12px; font-weight: 700; border-radius: 6px; padding: 3px 9px;
  margin-bottom: 4px; white-space: nowrap;
}
/* 팀 카드 안에서 다시 묶는 소제목(현장팀). 팀 머리표와 같은 칩이되 작다. */
.org-sub {
  display: inline-block; background: var(--chip); color: var(--on-chip);
  font-size: 11px; font-weight: 700; border-radius: 6px; padding: 3px 8px;
  margin: 12px 0 0;
}
.org-members { display: block; }
.org-member {
  background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 10px; margin-top: 8px; line-height: 1.35; white-space: nowrap;
}
.org-member .n { font-weight: 600; font-size: 14px; }
.org-member .r { color: var(--muted); font-size: 12.5px; }

/* 팀이 하나뿐인 그룹(경영진·총괄운영본부)은 원본처럼 사람을 가로로
   늘어놓는다. 세로로 세우면 위쪽이 쓸데없이 길어진다. */
.org-team.wide .org-members { display: flex; flex-wrap: nowrap; gap: 8px; }
.org-team.wide .org-member { margin-top: 8px; min-width: 116px; }

/* ── 조직도 편집 ────────────────────────────────────────
 * 편집을 켠 동안에만 손잡이가 보인다. 늘 보이면 조직도를 읽는 화면이
 * 아니라 고치는 화면이 된다.
 */
.org-member.edit { cursor: grab; position: relative; padding-right: 24px; }
.org-member.edit:hover { border-color: var(--accent); }
.org-member.dragging { opacity: .4; cursor: grabbing; }

.org-del {
  position: absolute; top: 4px; right: 4px;
  width: 18px; height: 18px; padding: 0; line-height: 1;
  border: 0; border-radius: 5px; background: transparent;
  color: var(--muted); font-size: 11px; cursor: pointer; opacity: 0;
}
.org-member.edit:hover .org-del { opacity: 1; }
.org-del:hover { background: var(--danger-soft); color: var(--danger); }

/* 놓을 수 있는 자리. 끌고 있는 동안에만 테두리가 보인다 — 어디에 놓이는지
   모른 채로 손을 떼면 사람이 엉뚱한 팀에 가 있게 된다. */
.org-members.over {
  outline: 2px dashed var(--accent); outline-offset: 3px; border-radius: 8px;
}

.org-add {
  display: block; width: 100%; margin-top: 8px; padding: 6px;
  border: 1px dashed var(--line); border-radius: 9px; background: transparent;
  color: var(--muted); font-size: 12px; cursor: pointer;
}
.org-add:hover { border-color: var(--accent); color: var(--accent); }

.org-team-h[onclick] { cursor: pointer; }
.org-team-h[onclick]:hover { background: var(--accent); }
.org-team-h.editing { background: var(--accent); outline: 2px solid var(--accent); }

/* 사람 넣을 때 자리에서 뜨는 칸. 단추 크기 그대로 들어앉아야 줄이 안 튄다. */
.org-add-input {
  width: 100%; border: 0; background: transparent; color: var(--text);
  font: inherit; font-size: 12px; text-align: center; outline: none;
}

/* 연락처 카드도 편집 중에만 손잡이가 된다. */
.person.edit { cursor: pointer; }
.person.edit:hover { border-color: var(--accent); }

/* 편집 창의 두 칸짜리 배치. 좁으면 위아래로 눕는다. */
.form-grid {
  display: grid; grid-template-columns: 90px 1fr; gap: 10px 12px; align-items: center;
}
.form-grid label { text-align: right; }
.form-grid input, .form-grid select {
  width: 100%; padding: 8px 10px; font: inherit; font-size: 14px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--text);
}
.form-grid input:focus, .form-grid select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.modal { max-height: 86vh; overflow-y: auto; }

@media (max-width: 480px) {
  .form-grid { grid-template-columns: 1fr; gap: 4px; }
  .form-grid label { text-align: left; margin-top: 8px; }
}

/* 편집 손잡이는 종이에 찍히지 않는다. */
.printing .org-del, .printing .org-add { display: none !important; }

/* 원본 맨 아래의 로고 자리. 로고 자체는 Logo.html 에 들어 있다. */
.org-foot { text-align: center; margin-top: 34px; }

/* ── 조직도 인쇄 (A3 가로 한 장) ─────────────────────────
 * .printing 은 beforeprint 에서 잠깐 켜졌다가 afterprint 에서 꺼진다.
 * 인쇄용 레이아웃을 화면에도 똑같이 적용해야 Script.html 이 잰 높이와
 * 실제로 찍히는 높이가 같아진다. @media print 안에만 적어 두면 재는 것과
 * 찍히는 것이 달라져서, 딱 맞게 줄였는데 두 장으로 나온다.
 */
.printing header,
.printing #toast,
.printing .mask,
.printing .preview-flag { display: none !important; }
.printing .view { display: none !important; }
.printing #v-directory { display: block !important; }
.printing .wrap { max-width: none; padding: 0; }
/* 종이에는 조직도만 나간다. 연락처는 개인정보라 붙여 두는 종이에 실리면
   안 되고, 화면 제목과 안내 문구는 종이에서 자리만 먹는다. */
.printing #v-directory h1,
.printing #v-directory .lead,
.printing #v-directory .sec-h,
.printing #v-directory .note,
.printing #dir-list,
.printing #birthday,
.printing .org-meta { display: none !important; }

/* 종이에서는 모눈과 테두리가 잉크만 먹는다. 조직도 자체는 화면과 같은
   배치 그대로 나간다 — 종이와 화면이 다른 그림이면 둘 중 하나는 거짓말이다. */
.printing .org-sheet {
  background: none; border: 0; border-radius: 0; padding: 0; overflow: visible;
}
/* 가운데 놓는 것은 preparePrint 가 재서 넣는다. margin:auto 는 인쇄 배치에서
   부모 폭이 0 으로 잡혀 듣지 않는다. */
.printing #org-body { transform-origin: top left; }
.printing .org-team { box-shadow: none; padding: 9px; }
.printing .org-member { padding: 5px 8px; margin-top: 5px; }
.printing .org-row { margin-bottom: 22px; }
.printing .org-title { margin-bottom: 22px; }

@media print {
  @page { size: A3 landscape; margin: 10mm; }

  /* 다크 모드로 보고 있어도 종이는 희다. 화면 색을 그대로 보내면 잉크만 먹는다. */
  :root {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f1eeeb;
    --text: #2f2b26; --muted: #655c53; --line: #bdb6ae;
    --chip: #46413a; --on-chip: #ffffff; --shadow: none;
  }
  body { background: #fff; }

  /* 브라우저가 기본으로 바탕색을 빼 버린다. 칩이 흰 상자가 되면 구분이 사라진다. */
  .org-group-h, .org-team-h, .org-sub {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
}

/* ── 프로세스 단계 ──────────────────────────────────── */
.steps { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; }
.steps div {
  flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; font-size: 13px;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
}

/* ── 체크리스트 ─────────────────────────────────────── */
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0;
       border-bottom: 1px solid var(--line); }
.chk:last-child { border-bottom: 0; }
.chk input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); }
.chk.done label { color: var(--muted); text-decoration: line-through; }
.phase { font-size: 12px; font-weight: 700; color: var(--accent);
         text-transform: none; margin: 18px 0 2px; }

/* ── 제출 서류 ──────────────────────────────────────── */
.sub {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 0; border-bottom: 1px solid var(--line);
}
.sub:last-child { border-bottom: 0; }
.sub .ico { font-size: 20px; line-height: 1.3; flex: 0 0 auto; }
.sub .body { flex: 1 1 auto; min-width: 0; }
.sub .t { font-weight: 600; }
.sub .d { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.sub .f { font-size: 13px; margin-top: 6px; color: var(--muted); word-break: break-all; }
.sub .act { flex: 0 0 auto; }
.sub input[type=file] { display: none; }
.filebtn {
  display: inline-block; font-size: 14px; font-weight: 600; cursor: pointer;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--text); white-space: nowrap;
}
.filebtn:hover { border-color: var(--accent); }
.filebtn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ── 표 ─────────────────────────────────────────────── */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
         white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; }

/* ── 알림 ───────────────────────────────────────────── */
/*
 * 온보딩 인사말.
 *
 * 홈 화면의 히어로 띠와 같은 재료를 쓴다 — 이미 있는 색을 재활용해야 화면이
 * 한 벌로 보인다. 다만 여기는 한 번 읽고 지나가는 자리라 더 조용해야 한다.
 * 크게 만드는 것은 첫 줄 하나뿐이고 나머지는 본문 크기 그대로다.
 */
/* 로그인 전에는 머리띠가 없다. Index.html 의 body 주석 참고. */
body.pre-login header { display: none; }

/* ── 상담실 예약 ─────────────────────────────────────
 * 시간 칸이 많다(30분 단위로 하루 28칸). 칸마다 테두리를 두르면 화면이
 * 격자무늬가 되어 정작 고른 칸이 안 보인다. 평소에는 옅게 두고 고른 것만
 * 진하게 한다. 이미 찬 칸은 눌리지 않는 것이 눈에 보여야 한다 — 눌러 보고
 * 나서 안 된다고 하면 그때까지 쓴 시간이 헛것이 된다.
 */
.steps-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.steps-bar > div {
  display: flex; align-items: center; gap: 7px;
  font-size: 13.5px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
  background: var(--surface);
}
.steps-bar > div .n {
  width: 19px; height: 19px; border-radius: 50%; flex: 0 0 auto;
  background: var(--surface-2); color: var(--muted);
  font-size: 11.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.steps-bar > div.on { border-color: var(--accent); color: var(--text); font-weight: 600; }
.steps-bar > div.on .n { background: var(--accent); color: var(--on-accent); }
.steps-bar > div.done .n { background: var(--accent-soft); color: var(--accent); }

.bk-h { font-size: 15px; font-weight: 700; margin: 0 0 12px; letter-spacing: -.01em; }
.bk-sub { font-size: 12.5px; font-weight: 700; color: var(--muted);
          margin: 16px 0 8px; letter-spacing: .02em; }
.bk-cols { display: grid; gap: 26px; grid-template-columns: minmax(260px, 320px) 1fr; }
@media (max-width: 720px) { .bk-cols { grid-template-columns: 1fr; gap: 18px; } }

/* 달력 */
.cal-h { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-h b { font-size: 15px; letter-spacing: -.01em; }
.cal-h .spacer { flex: 1 1 auto; }
.cal-h button { padding: 4px 10px; font-size: 13px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal .dow { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
.cal .dow.sun { color: var(--danger); }
.cal .dow.sat { color: var(--info); }
.cal button {
  border: 0; background: transparent; padding: 8px 0; border-radius: 8px;
  font-size: 14px; font-weight: 500; color: var(--text);
}
.cal button:hover:not(:disabled) { background: var(--surface-2); }
.cal button.on { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.cal button:disabled { color: var(--line); cursor: default; }
.cal button.sun:not(.on):not(:disabled) { color: var(--danger); }
.cal button.sat:not(.on):not(:disabled) { color: var(--info); }
.cal .pad { visibility: hidden; }

/* 시간 칸 */
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slots button {
  border: 1px solid var(--line); background: var(--surface);
  padding: 7px 13px; border-radius: 8px; font-size: 13.5px; font-weight: 500;
  min-width: 62px;
}
.slots button:hover:not(:disabled) { border-color: var(--accent); }
.slots button.on {
  background: var(--accent); border-color: var(--accent);
  color: var(--on-accent); font-weight: 700;
}
.slots button:disabled {
  background: var(--surface-2); color: var(--line);
  border-color: transparent; cursor: not-allowed;
}

/* 상담실 카드 */
.rooms { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.rooms button {
  text-align: left; padding: 16px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); font-weight: 400;
}
.rooms button .t { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.rooms button .d { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.rooms button:hover:not(:disabled) { border-color: var(--accent); }
.rooms button.on { border-color: var(--accent); background: var(--accent-soft); }
.rooms button:disabled { opacity: .5; cursor: not-allowed; }

/* 담당자_상담내용. 밑줄을 화면에도 그려서 저장되는 모양을 그대로 보인다. */
.bk-who-what { display: grid; grid-template-columns: minmax(90px, 1fr) auto minmax(120px, 2fr);
               gap: 8px; align-items: center; }
.bk-who-what .bk-join { color: var(--muted); font-weight: 700; }
@media (max-width: 480px) {
  /* 좁은 화면에서 두 칸을 나란히 두면 둘 다 못 읽는다. 밑줄은 설명이 대신한다. */
  .bk-who-what { grid-template-columns: 1fr; }
  .bk-who-what .bk-join { display: none; }
}

/* 확인 단계의 요약 */
.bk-sum { display: grid; gap: 8px; grid-template-columns: 90px 1fr; font-size: 14.5px; }
.bk-sum dt { color: var(--muted); font-size: 13px; }
.bk-sum dd { margin: 0; font-weight: 600; }

/* 그날 잡힌 예약 */
.bk-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
          border-bottom: 1px solid var(--line); padding: 11px 0; }
.bk-row:last-child { border-bottom: 0; }
.bk-row .when { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bk-row .who { color: var(--muted); font-size: 13.5px; }

/* ── 월간 일정표 ───────────────────────────────────────
 * 종이로 돌던 한 장을 화면으로 옮긴 것이라, 종이의 뼈대를 그대로 지킨다 —
 * 왼쪽에 연도, 가운데 월, 오른쪽에 워드마크, 그 아래 검은 요일 띠.
 *
 * 색은 브랜드 변수에서만 가져온다. 종이 표의 파랑·노랑·초록·빨강을
 * 화면 색으로 그대로 쓰면 어두운 화면에서 글자가 바탕에 묻힌다.
 */
.sc-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
          gap: 12px; margin: 4px 0 22px; }
.sc-year { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.sc-title { display: flex; align-items: center; gap: 14px; justify-self: center; }
.sc-title b { font-size: 27px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
.sc-arrow {
  width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 0;
  background: var(--chip); color: var(--on-chip); font-size: 14px; line-height: 1;
  cursor: pointer; flex: 0 0 auto;
}
.sc-arrow:hover { opacity: .85; }
.sc-mark { justify-self: end; text-align: right; font-size: 13px; font-weight: 600;
           line-height: 1.45; }
.sc-mark-2 { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
.sc-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }

/* 좁은 화면에서 일곱 칸을 억지로 욱여넣으면 글자가 한 자씩 끊긴다.
   달력은 한 달이 한 장으로 보여야 표 노릇을 하므로, 줄이는 대신 옆으로 민다. */
.mcal-wrap { overflow-x: auto; padding: 3px 3px 6px; margin: 0 -3px; }

/* 달을 옮기는 동안. 표를 지우지 않고 흐리게만 둔다 — 빈 화면이 한 번
   번쩍이는 것보다 옛 표가 흐려졌다가 새 표가 오는 편이 덜 어수선하다.
   pointer-events 를 끊어 두 번 누르는 것도 막는다. */
.sc-busy { opacity: .4; pointer-events: none; transition: opacity .12s; }
.mcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px; min-width: 660px; }
.mcal .dow {
  background: var(--chip); color: var(--on-chip); border-radius: 999px;
  text-align: center; font-size: 12.5px; font-weight: 700; letter-spacing: .08em;
  padding: 7px 0;
}
.mcal .cell {
  background: var(--surface); border-radius: 14px; min-height: 112px;
  padding: 9px 9px 10px; position: relative; box-shadow: var(--shadow);
}
.mcal .cell .d { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mcal .cell.sun .d { color: var(--danger); }
.mcal .cell.sat .d { color: var(--info); }
/* 지난 달·다음 달 자리. 자리는 지키되 눈에 걸리지 않아야 한다.
   요일 색보다 뒤에 둔다 — 앞에 두면 지난 달 일요일이 이 달처럼 빨갛다. */
.mcal .cell.out { background: transparent; box-shadow: none; }
.mcal .cell.out .d { color: var(--line); }
/*
 * 오늘 칸의 테두리는 상자 '안쪽' 에 그린다.
 *
 * outline 으로 두었더니 토요일 칸에서 오른쪽 선이 잘렸다. outline 은 상자
 * 바깥에 그려지는데, 좁은 화면에서 달력을 옆으로 밀 수 있게 감싼 상자
 * (.mcal-wrap)의 overflow 가 삐져나온 만큼을 잘라내기 때문이다.
 * inset 그림자는 상자를 벗어나지 않으므로 어느 칸에서도 잘리지 않는다.
 */
.mcal .cell.today { box-shadow: inset 0 0 0 2px var(--accent), var(--shadow); }
/*
 * 종류를 알리는 동그라미. 클래스 이름을 .badge 로 두었다가 글자가 동그라미
 * 밖으로 밀려났다 — 화면 전체가 쓰는 .badge 에 padding: 2px 8px 이 걸려
 * 있고, border-box 19px 안에서 그 여백이 글자 자리를 0 으로 만든다.
 * 알약 배지와 동그라미는 다른 물건이므로 이름부터 나눠 둔다.
 *
 * 가운데 맞춤은 line-height 가 아니라 flex 로 한다. 글꼴이 바뀌어도,
 * 테두리 두께를 고쳐도 가운데가 흔들리지 않는다.
 */
.kind-dot {
  display: inline-flex; align-items: center; justify-content: center;
  width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid currentColor;
  font-size: 10.5px; font-weight: 700; line-height: 1; flex: 0 0 auto;
}
.mcal .cell .kind-dot { position: absolute; top: 8px; right: 8px; }
.mcal .evs { margin-top: 7px; display: flex; flex-direction: column; gap: 4px; }

/*
 * 일정 칩. 종이 표에서 날짜 아래 붙어 있던 색 막대다.
 *
 * 색 이름을 뜻이 아니라 색으로 부른다(tone-blue, tone-red…). 예전에는
 * tone-flag·tone-ext 처럼 뜻으로 불렀는데, 종류를 담당자가 만들게 되면서
 * 「플래그십 색을 외부 일정에 쓰는」 경우가 생겼다. 그때 이름이 거짓말을 한다.
 */
.ev {
  position: relative;
  /*
   * 999px 로 두었더니 두 줄짜리 칩(전체회의 + 상세)이 통째로 타원이 됐다.
   * 999px 는 「높이의 절반」 으로 잘리는데, 두 줄이면 그 절반이 21px 이라
   * 칩이 알약이 아니라 달걀이 된다. 한 줄일 때 알약으로 보이는 값(11px)에
   * 가까우면서 두 줄에서도 모서리로만 남는 값으로 고정한다.
   */
  border-radius: 12px; padding: 3px 7px; font-size: 11.5px; font-weight: 600;
  /* 두 줄짜리 칩(전체회의 + 상세)이 칸의 절반을 먹었다. 줄 사이를 좁힌다. */
  text-align: center; line-height: 1.2; word-break: keep-all;
  border: 0; width: 100%; cursor: default; display: block;
}
/*
 * 칩 안의 한 줄. 줄을 나누는 것은 scEvLines() 다 — 괄호 앞에서 끊어서
 * 「전체회의」 아래에 「(현장사례발표)」 가 오게 한다.
 *
 * 그 밖에는 접히지 않는다(nowrap). 근무자 이름 셋은 본문 폭 940px 에서
 * 11.5px 로는 한 줄에 안 들어가는데, 접어서 두 줄로 만드는 대신 글자를
 * 줄여서 한 줄로 넣는다 — 그게 종이 표의 모양이다. 줄이는 일은 CSS 가
 * 못 하므로 scFitChips() 가 칸을 재서 이 자리에 크기를 써 넣는다.
 */
.ev .ln { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 클래스 이름을 .sub 로 두었다가 제출 서류 목록의 .sub(padding: 14px 0)가
   함께 걸려 칩이 40px 로 부풀었다. 뜻이 겹치는 짧은 이름은 쓰지 않는다. */
.ev .ln.ln-detail { font-size: 10px; opacity: .82; }
/* × 는 글 흐름 밖에 둔다. 줄 안에 끼우면 그만큼 줄이 좁아져서 관리자 화면에서만
   이름이 두 줄로 갈라진다. 대신 그 자리를 padding 으로 비워 둔다. */
.ev.can-edit { padding-right: 20px; }
.ev .x {
  position: absolute; top: 50%; right: 4px; transform: translateY(-50%);
  border: 0; background: none; color: inherit; opacity: .5; cursor: pointer;
  font-size: 13px; line-height: 1; padding: 0 2px;
}
.ev .x:hover { opacity: 1; }
.tone-red  { background: var(--danger-soft); color: var(--danger); }
.tone-yellow   { background: var(--warn-soft);   color: var(--warn); }
.tone-blue { background: var(--info-soft);   color: var(--info); }
.tone-green  { background: var(--accent-soft); color: var(--accent); }
.tone-gray { background: var(--surface-2);   color: var(--muted); }

/* 범례와 이달의 안내. 종이 표에서도 맨 아래 나란히 있던 두 상자다. */
.sc-foot { display: grid; grid-template-columns: minmax(220px, 300px) 1fr;
           gap: 14px; margin-top: 18px; }
@media (max-width: 720px) { .sc-foot { grid-template-columns: 1fr; } }
.sc-foot-h { font-size: 13.5px; font-weight: 700; margin-bottom: 12px; }
.sc-key .row-k { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.sc-key .row-k .ev { width: auto; padding: 3px 12px; }
.sc-focus ul { margin: 0; padding-left: 18px; }
.sc-focus li { font-size: 14px; line-height: 1.75; }
.sc-focus li .m { color: var(--muted); font-size: 13px; }

/* 일정 종류 고치기(관리자). 자주 열 자리가 아니라 눈에 덜 띄게 둔다. */
.sc-kinds { margin-top: 18px; }
.kind-row { display: flex; align-items: center; gap: 10px;
            padding: 8px 0; border-bottom: 1px solid var(--line); }
.kind-row:last-of-type { border-bottom: 0; }
.kind-row .nm { font-weight: 600; font-size: 14px; }
.kind-row .hue { color: var(--muted); font-size: 12.5px; }
.kind-add { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px;
            padding-top: 14px; border-top: 1px solid var(--line); }
.kind-add input[type=text] { flex: 1 1 200px; min-width: 0; }
.kind-add #kd-badge { flex: 0 0 62px; text-align: center; }
.kind-add select { flex: 0 0 96px; }

/* 휴가 등록표. 달력과 붙어 있지만 다른 표라서 모양도 다르게 둔다 —
   달력은 칸이고, 이쪽은 줄이다. */
.lv-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
          padding: 10px 0; border-bottom: 1px solid var(--line); }
.lv-row:last-child { border-bottom: 0; }
.lv-row .when { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lv-row .who { font-weight: 600; }
.lv-row .dept { color: var(--muted); font-size: 13.5px; }
.lv-row .why { color: var(--muted); font-size: 13.5px; }
.lv-kind { border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700;
           background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.lv-kind.mine { background: var(--info-soft); color: var(--info); }

/*
 * 로그인 화면.
 *
 * 세로로 가운데 놓는다. 이 화면에는 다른 것이 없으므로 위에 붙여 두면
 * 아래가 텅 빈 채로 남는다. 좁은 화면에서는 가운데 정렬을 풀고 위에서부터
 * 쌓는다 — 키보드가 올라오면 가운데가 밀려 올라가 그림이 잘린다.
 */
.login-wrap {
  max-width: 380px; margin: 0 auto; padding: 8vh 0 40px; text-align: center;
}
.login-title {
  font-size: 19px; font-weight: 700; line-height: 1.55;
  letter-spacing: -.02em; color: var(--text); margin: 0 0 26px;
}
.login-card { text-align: left; box-shadow: var(--shadow); }
.login-card button { width: 100%; }

@media (max-width: 640px) {
  /*
   * 위를 넉넉히 띄운다. 폰에서는 이 화면이 상태표시줄 바로 밑에서 시작해서
   * 로고가 화면 꼭대기에 붙어 보였다. 아래는 어차피 비어 있으므로 내려도
   * 잘리지 않는다. 앱으로 깔아 열면 주소창이 없어 더 위로 붙는다.
   */
  .login-wrap { padding: 56px 0 40px; }
  .login-title { font-size: 17px; margin-bottom: 20px; }
  .login-logo { width: 160px; height: 23px; margin-bottom: 20px; }
  .welcome-mark { width: 176px; height: 110px; }
}

/*
 * 온보딩 환영 배너.
 *
 * 처음 온 사람이 이 화면에서 제일 먼저 읽는 자리다. 크게 잡되 장식은 두지
 * 않는다 — 상단 띠를 한 번 대 봤더니 화면이 시끄러워져서 걷어냈다.
 *
 * 그림 파일을 쓰지 않고 활자로 짠 이유:
 * 글자가 그림 안에 박히면 담당자가 나중에 한 글자도 못 고친다. 다크 모드와
 * 좁은 화면에서도 따로 손봐야 한다. 문구는 시트에 남기고 모양만 여기서 만든다.
 *
 * 왼쪽 정렬이다. 가운데로 맞추면 줄마다 첫 글자 자리가 달라져서 여러 줄을
 * 읽어 내려갈 때 눈이 매번 시작점을 다시 찾는다.
 */
.welcome {
  background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius);
  margin: 28px 0 30px; overflow: hidden;
}

.welcome-body { padding: 44px 42px 42px; }

.welcome-eyebrow {
  font-size: 12px; font-weight: 700; letter-spacing: .16em;
  text-transform: uppercase; color: var(--taupe); margin: 0 0 14px;
}
.welcome h1 {
  font-size: 30px; line-height: 1.35; letter-spacing: -.03em;
  margin: 0; color: var(--brand);
}
.welcome .rule {
  width: 52px; height: 2px; background: var(--brand);
  margin: 20px 0 22px; border-radius: 2px;
}
.welcome img {
  display: block; max-width: 420px; width: 100%;
  margin: 0 0 24px; border-radius: 6px;
}
.welcome .doc-body { max-width: 60ch; }
.welcome .doc-body p {
  margin: 0 0 13px; line-height: 1.85; color: var(--muted); font-size: 15px;
}
.welcome .doc-body p:last-child { margin-bottom: 0; }

@media (max-width: 640px) {
  .welcome { margin: 18px 0 24px; }
  .welcome-body { padding: 30px 20px 28px; }
  .welcome h1 { font-size: 22px; }
  .welcome-eyebrow { font-size: 11px; letter-spacing: .13em; }
  .welcome .doc-body p { font-size: 14.5px; line-height: 1.8; }
}

/*
 * 읽는 글 (온보딩 「알아두어야 할 것」).
 *
 * 이 자리의 글은 다른 데와 성격이 다르다. 표도 목록도 아니고, 처음 온 사람이
 * 앉아서 읽어 내려가는 글이다. 그런데 본문을 통째로 회색 pre-line 한 덩어리로
 * 뿌리면 제목·소제목·목록이 전부 같은 무게가 되어 어디부터 읽어야 할지 알 수
 * 없다. 실제로 그렇게 보였다.
 *
 * 그래서 색이나 장식이 아니라 활자와 여백으로만 층을 만든다. 색을 더 쓰면
 * 브랜드 톤이 흐트러지고, 정작 봐야 할 경고(빨강)·안내(초록)와 다툰다.
 *
 * 한 줄 길이를 68자로 묶는다. 넓은 화면에서 글이 끝까지 늘어나면 다음 줄
 * 첫머리를 찾다가 눈이 미끄러진다.
 */
.doc { display: grid; gap: 10px; }

.doc-nav {
  display: flex; flex-wrap: wrap; gap: 6px 8px;
  padding: 0 0 4px; margin: -4px 0 6px;
}
.doc-nav a {
  font-size: 13px; color: var(--muted); text-decoration: none;
  padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); white-space: nowrap;
}
.doc-nav a:hover { color: var(--text); border-color: var(--taupe); }

.doc-sec {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 24px 26px; scroll-margin-top: 76px;
}
.doc-sec > h3 {
  display: flex; align-items: baseline; gap: 9px;
  font-size: 17px; letter-spacing: -.01em; margin: 0 0 14px;
}
.doc-sec > h3 .em { font-size: 19px; line-height: 1; }

/* 본문 폭. 카드는 넓어도 글줄은 여기서 멈춘다. */
.doc-body { max-width: 68ch; }

/* 첫 카드의 첫 문단만 크게. 회사가 무엇을 하는 곳인지가 첫 줄이다. */
.doc-sec.lead-sec .doc-body > p:first-child {
  font-size: 17px; line-height: 1.65; color: var(--text);
}

.doc-body p { margin: 0 0 12px; line-height: 1.75; color: var(--muted); }
.doc-body p:last-child { margin-bottom: 0; }

/* 「[미션]」 같은 대괄호 줄. 소제목이지 본문이 아니다. */
.doc-body .lbl {
  font-size: 12px; font-weight: 600; letter-spacing: .04em;
  color: var(--text); margin: 20px 0 7px;
}
.doc-body > :first-child.lbl { margin-top: 0; }

.doc-body ul, .doc-body ol { margin: 0 0 12px; padding-left: 1.15em; }
.doc-body ul { list-style: none; padding-left: 0; }
.doc-body ul > li {
  position: relative; padding-left: 15px;
  margin: 0 0 7px; line-height: 1.7; color: var(--muted);
}
.doc-body ul > li::before {
  content: ''; position: absolute; left: 2px; top: .66em;
  width: 4px; height: 4px; border-radius: 50%; background: var(--taupe);
}
.doc-body ol > li { margin: 0 0 7px; line-height: 1.7; color: var(--muted); }
.doc-body li:last-child { margin-bottom: 0; }
/* 「이름 — 설명」 에서 앞부분. 목록이 길 때 훑어보는 손잡이가 된다. */
.doc-body li b { color: var(--text); font-weight: 600; }

@media (max-width: 640px) {
  .doc-sec { padding: 18px 18px; }
  .doc-sec.lead-sec .doc-body > p:first-child { font-size: 16px; }
}

/*
 * 안내 상자.
 *
 * pre-line 이 필요하다 — 콘텐츠 시트의 본문과 로그인 안내가 줄바꿈(\n)을
 * 담아 오고, 그게 살아야 문단이 문단으로 보인다.
 *
 * ★ 대신 이 상자 안에서는 여는 태그 바로 뒤에 글을 붙여 써야 한다.
 *   <div class="note info">
 *     글
 *   </div>
 *   처럼 쓰면 태그 뒤의 줄바꿈까지 그대로 살아나서 위아래로 빈 줄이 한 줄씩
 *   생긴다. 여백이 어긋난 것처럼 보이는데 CSS 를 아무리 봐도 원인이 없다.
 */
.note { border-radius: var(--radius); padding: 12px 16px; font-size: 14px;
        margin: 16px 0; white-space: pre-line; }
.note.info { background: var(--accent-soft); color: var(--accent); }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.err  { background: var(--danger-soft); color: var(--danger); }

/* 자료실 안내 박스의 제목. .note 가 pre-line 이라 block 으로 세워야 줄이 진다.
   전역 클래스 이름을 피해 화면 접두사를 붙인다(dn = docs notice). */
.dn-title { display: block; font-size: 15px; margin-bottom: 4px; }

#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
  font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 50; max-width: 90vw;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 모달 ───────────────────────────────────────────── */
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40;
        display: flex; align-items: center; justify-content: center; padding: 20px; }
.mask[hidden] { display: none; }
.modal { background: var(--surface); border-radius: var(--radius); padding: 22px;
         width: 100%; max-width: 460px; box-shadow: var(--shadow); }

/* 자료실 맨 위의 회사소개 자리. 클래스에 doc-about- 을 붙여 화면 전체가
   쓰는 이름(.t 같은 것)과 부딪히지 않게 한다. */
.doc-about { margin-bottom: 16px; border-color: var(--accent); }
.doc-about-t { font-weight: 700; font-size: 16px; }

/* ── 회사소개 ───────────────────────────────────────────
 *
 * 이 화면만 규칙이 둘 다르다.
 *
 * 첫째, 한 번에 한 덩어리만 읽히게 한다. 나머지 화면은 직원이 답을 찾으러
 * 오므로 한 눈에 다 보이는 것이 미덕이지만, 여기는 직원이 고객 옆에 앉아
 * 화면을 넘기며 설명하는 자리다.
 *
 * 둘째, **바깥 테마를 따라가지 않는다.** 색이 전부 아래 --ab-* 안에 있고
 * 다크 모드 블록에서 뒤집지 않는다. 고객이 보는 화면이라, 누가 어떤 설정으로
 * 열든 같은 회사로 보여야 한다 — 일정표 이미지(--img-*)와 같은 판단이다.
 * 어둡게 간 것은 취향이 아니라 사진 때문이다. 바탕이 밝으면 사진이 벽지가 된다.
 *
 * 클래스에 ab- 를 붙인 이유는 .badge·.sub 로 두 번 깨진 적이 있어서다.
 */
.ab {
  --ab-bg: #17140f;          /* Deep Espresso 를 더 낮춘 바탕 */
  --ab-bg2: #1f1b15;
  --ab-fg: #f3efe9;
  --ab-dim: #a89d90;
  --ab-line: rgba(243, 239, 233, .14);
  --ab-accent: #ecb85c;      /* Golden Sand. 어두운 바탕에서 유일하게 밝은 것 */
  position: relative;
  background: var(--ab-bg);
  color: var(--ab-fg);
}
#v-about.on { display: block; }
/* 포털 안에서 열릴 때는 본문 틀(940px)을 아예 벗어난다. 사진이 화면 끝까지
   닿아야 사진으로 보인다 — go() 가 body 에 about-wide 를 붙인다. */
body.about-wide .wrap { max-width: none; padding-left: 0; padding-right: 0; }
.ab-sec, .ab-hero-in, .ab-foot { max-width: 860px; margin-inline: auto; padding-inline: 24px; }

/* 위에 걸리는 진행 막대. 길이를 알려 주는 것 말고 다른 일을 하지 않는다. */
.ab-rail { position: sticky; top: 0; z-index: 5; height: 2px; background: var(--ab-line); }
.ab-rail i { display: block; height: 100%; background: var(--ab-accent);
             transform: scaleX(0); transform-origin: 0 50%; }

/* ── 머리말 ─────────────────────────────────────────── */
.ab-hero { position: relative; min-height: 92vh; display: flex; align-items: flex-end;
           overflow: hidden; }
.ab-hero-bg { position: absolute; inset: 0; background: var(--ab-bg2); }
.ab-hero-bg img { width: 100%; height: 100%; object-fit: cover; display: block;
                  will-change: transform; }
/* 사진 위에 글자를 얹는 순간 대비가 사진마다 달라진다. 아래쪽을 확실히
   눌러 두면 어떤 사진이 와도 문장이 읽힌다. */
.ab-hero::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to top, var(--ab-bg) 2%, rgba(23,20,15,.82) 34%, rgba(23,20,15,.18) 78%);
}
.ab-hero-in { position: relative; z-index: 1; width: 100%; padding-bottom: 64px; padding-top: 120px; }
.ab-hero-t { font-size: clamp(32px, 6.2vw, 62px); line-height: 1.22; letter-spacing: -.025em;
             font-weight: 700; margin: 0; color: #fff; }
.ab-hero-s { font-size: clamp(15px, 2.1vw, 20px); color: var(--ab-dim); margin: 18px 0 0; }
/*
 * 아래로 내려가라는 표시.
 *
 * 가는 세로선 하나였는데 어두운 사진 위에서 화면 긁힌 자국처럼 보였다.
 * 동그라미 안의 화살표로 바꾼다. 원은 어떤 사진 위에 얹혀도 형태가 남고,
 * 화살표는 방향을 말한다. 원을 따라 도는 글자로 한번 바꿨다가 되돌렸다 —
 * 첫 화면에서 도는 것이 하나 있으면 시선이 그리로 끌려가서, 정작 읽어야 할
 * 문장이 뒤로 밀린다.
 */
.ab-cue {
  display: inline-flex; align-items: center; gap: 10px;
  margin-top: 40px; padding: 0; border: 0; background: none;
  color: var(--ab-dim); cursor: pointer; font: inherit;
  animation: ab-cue 2.6s ease-in-out infinite;
}
/* 원은 SCROLL 글자와 같은 키로 맞춘다. 크게 두면 표시가 아니라 단추가
   되어 버려서, 첫 화면에서 문장보다 먼저 눈에 들어온다. */
.ab-cue-ring {
  width: 20px; height: 20px; border-radius: 50%; flex: none;
  border: 1px solid rgba(243, 239, 233, .35);
  display: inline-flex; align-items: center; justify-content: center;
  transition: border-color .3s, background-color .3s, transform .3s;
}
/* 화살촉은 정사각형의 두 변만 남기고 45도 돌린 것이다. 글꼴이 무엇이든,
   글자가 아니라 도형이라 어디서나 같은 모양으로 나온다. */
.ab-cue-ring i {
  width: 5px; height: 5px; margin-top: -2px;
  border-right: 1.2px solid var(--ab-accent);
  border-bottom: 1.2px solid var(--ab-accent);
  transform: rotate(45deg);
}
.ab-cue-label { font-size: 11px; font-weight: 700; letter-spacing: .22em; }
.ab-cue:hover .ab-cue-ring { border-color: var(--ab-accent);
                             background: rgba(236, 184, 92, .12); transform: translateY(3px); }
.ab-cue:focus-visible { outline: 2px solid var(--ab-accent); outline-offset: 6px; border-radius: 999px; }
@keyframes ab-cue { 0%, 100% { transform: translateY(0); opacity: .75; }
                    50% { transform: translateY(7px); opacity: 1; } }

/* ── 묶음 ───────────────────────────────────────────── */
.ab-sec { padding-block: 108px; }
.ab-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .16em;
              color: var(--ab-accent); margin: 0 0 16px; }
.ab-h { font-size: clamp(24px, 3.8vw, 40px); line-height: 1.3; letter-spacing: -.02em;
        font-weight: 700; margin: 0; }
.ab-lead { font-size: 16px; line-height: 1.8; color: var(--ab-dim);
           margin: 20px 0 0; max-width: 62ch; }
.ab-lead:empty { display: none; }
.ab-foot { padding: 44px 24px 40px; border-top: 1px solid var(--ab-line); }

/* ── 등장 ───────────────────────────────────────────── */
/* --d 로 한 칸씩 늦춰서 차례로 도착하게 한다. */
.ab-up { opacity: 0; transform: translateY(26px);
         transition: opacity .7s cubic-bezier(.22,.61,.36,1) var(--d, 0ms),
                     transform .7s cubic-bezier(.22,.61,.36,1) var(--d, 0ms); }
.ab-up.on { opacity: 1; transform: none; }

/* 큰 제목은 단어가 차례로 올라온다. i 를 span 안에서 움직이고 span 이
   넘치는 부분을 잘라, 글자가 아래에서 밀려 올라오는 것처럼 보이게 한다. */
.ab-w { display: inline-block; overflow: hidden; vertical-align: bottom; }
.ab-w i { display: inline-block; font-style: normal; transform: translateY(105%);
          transition: transform .8s cubic-bezier(.22,.61,.36,1) var(--d, 0ms); }
.ab-split.on .ab-w i { transform: none; }

/* ── 이름 ──────────────────────────────────────────── */
/*
 * 줄을 손으로 짠 자리다(About.html 의 renderAbout). 줄마다 낱말과 사진이
 * 가로로 늘어서고, **사진이 그 줄의 남는 폭을 먹으며 늘어난다** — 그래서
 * 어느 줄이든 왼쪽 끝에서 오른쪽 끝까지 꽉 찬다. 사진을 고정 폭으로 두면
 * 줄마다 오른쪽이 들쭉날쭉해지고, 그 순간 이 짜임이 무너진다.
 *
 * 모서리를 둥글리지 않는다. 각진 네모라야 글자와 같은 재질로 보이고,
 * 둥글리면 사진만 따로 떠서 스티커처럼 얹힌다.
 */
/* 화면 끝까지 꽉 채우지 않는다. 양쪽에 여백이 있어야 이 덩어리가 「화면에
   깔린 배경」 이 아니라 「한 장의 판」 으로 읽힌다. */
.ab-name { text-align: center; max-width: 820px; }
.ab-name-line {
  /* 둘째 줄이 길어서 크기는 이 줄이 한 줄에 들어가는 선에 맞춘다.
     접히면 「Designing the Joy of / Everyday Life」 로 끊기는데, 그 끊김이
     뜻하는 바가 없어서 읽는 사람이 한 번 멈칫한다. */
  font-size: clamp(22px, 3.7vw, 42px); font-weight: 700;
  /* 다른 큰 제목보다 자간을 넓게 둔다. 여기는 읽는 문장이 아니라 보는
     덩어리라, 좁혀 붙이면 글자가 서로 밀어내는 것처럼 답답해진다. */
  letter-spacing: .02em; line-height: 1.35; margin: 0; color: #fff;
}
.ab-nrow { display: flex; align-items: center; justify-content: center;
           gap: .16em; flex-wrap: wrap; }
.ab-name-sub {
  font-size: clamp(14px, 1.8vw, 17px); font-weight: 400; letter-spacing: 0;
  color: var(--ab-dim); margin: 30px auto 0;
}
/* 높이를 글자 크기로 잡아야 줄 간격이 사진 때문에 벌어지지 않는다.
   flex 로 남는 폭을 먹되, 좁은 화면에서 실오라기가 되지 않게 바닥을 둔다. */
.ab-tile {
  flex: 1 1 2em; min-width: 1.8em; height: .92em;
  overflow: hidden; background: var(--ab-bg2);
  transform: scaleX(.12); transform-origin: 0 50%; opacity: 0;
  transition: transform .85s cubic-bezier(.22,.61,.36,1) var(--d, 0ms),
              opacity .5s ease var(--d, 0ms);
}
.ab-tile.on { transform: none; opacity: 1; }
/* 흑백으로 눕히고 어둡게 낮춘다 — 색이 남아 있거나 밝으면 사진끼리 다투고,
   글자보다 먼저 눈에 들어와서 문장이 끊긴다. 여기서 사진은 글자를 받쳐 주는
   재질이지 보여 줄 대상이 아니다. 사진 자체를 보여 주는 자리는 따로 있다
   (머리 사진과 사진 띠). */
.ab-tile img { width: 100%; height: 100%; object-fit: cover; display: block;
               filter: grayscale(1) brightness(.62) contrast(1.08); }

/* ── 사진 띠 ────────────────────────────────────────── */
.ab-band { height: 62vh; overflow: hidden; background: var(--ab-bg2); position: relative; }
.ab-band-img { width: 100%; height: 100%; object-fit: cover; display: block;
               will-change: transform;
               clip-path: inset(12% 14% 12% 14%);
               transition: clip-path 1.1s cubic-bezier(.22,.61,.36,1); }
.ab-band-img.on { clip-path: inset(0 0 0 0); }

/* ── 강점·가치 카드 ─────────────────────────────────── */
.ab-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 42px; }
.ab-cards-3 { grid-template-columns: repeat(3, 1fr); }
.ab-card { background: var(--ab-bg2); border: 1px solid var(--ab-line);
           border-radius: 18px; padding: 28px 26px;
           transition: transform .35s, border-color .35s; }
.ab-card:hover { transform: translateY(-4px); border-color: var(--ab-accent); }
.ab-card-n { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--ab-accent); }
.ab-card-t { font-size: 18px; font-weight: 700; margin: 12px 0 10px; letter-spacing: -.01em; }
.ab-card-b { font-size: 15px; line-height: 1.8; color: var(--ab-dim); }

/* ── 연혁 ───────────────────────────────────────────── */
.ab-time { margin-top: 46px; position: relative; }
.ab-time::before { content: ''; position: absolute; left: 7px; top: 10px; bottom: 10px;
                   width: 1px; background: var(--ab-line); }
.ab-t-row { position: relative; padding: 0 0 46px 36px; }
.ab-t-row::before { content: ''; position: absolute; left: 0; top: 7px;
                    width: 15px; height: 15px; border-radius: 50%;
                    background: var(--ab-bg); border: 2px solid var(--ab-line); }
/* 올해 칸만 채워서 표시한다. 「지금 어디까지 왔나」 가 연혁의 마지막 문장이다. */
/* 올해 칸만 채워서 표시하고, 거기서만 파문이 퍼진다. 연혁을 내려읽다가
   「지금 여기」 에서 눈이 한 번 멈추게 하는 것이 이 점 하나의 일이다. */
.ab-t-now::before { background: var(--ab-accent); border-color: var(--ab-accent);
                    animation: ab-pulse 2.6s ease-out infinite; }
@keyframes ab-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(236, 184, 92, .5); }
  70%  { box-shadow: 0 0 0 14px rgba(236, 184, 92, 0); }
  100% { box-shadow: 0 0 0 0 rgba(236, 184, 92, 0); }
}
.ab-t-year { font-size: 15px; font-weight: 700; letter-spacing: .02em; color: var(--ab-accent); }
.ab-t-tag { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 700;
            letter-spacing: .14em; color: var(--ab-dim); }
.ab-t-sum { font-size: 20px; font-weight: 700; line-height: 1.45;
            letter-spacing: -.01em; margin: 8px 0 12px; }
.ab-t-list { margin: 0; padding-left: 18px; }
.ab-t-list li { font-size: 15px; line-height: 1.9; color: var(--ab-dim); }

/* ── 숫자 ───────────────────────────────────────────── */
.ab-figures { border-block: 1px solid var(--ab-line); }
.ab-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; text-align: center; }
/* 큰 숫자는 절대 접지 않는다. 「4,000건+」 가 두 줄로 접히면 그 칸만 키가
   커져서 네 칸의 설명 줄이 제각기 다른 높이에 서고, 줄이 맞지 않는 순간
   숫자 넷이 한 묶음으로 안 읽힌다. 접을 바에는 글씨가 작아지는 쪽이 낫다. */
.ab-num-v { font-size: clamp(24px, 3.6vw, 42px); font-weight: 700; letter-spacing: -.03em;
            font-variant-numeric: tabular-nums; white-space: nowrap; }
.ab-num-l { font-size: 13px; color: var(--ab-dim); margin-top: 10px; }

/* ── 상담 과정 ──────────────────────────────────────── */
.ab-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 42px; }
.ab-step { background: var(--ab-bg2); border-radius: 16px; padding: 22px 20px; }
.ab-step-n { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--ab-accent); }
.ab-step-t { font-size: 16px; font-weight: 700; margin: 10px 0 8px; }
.ab-step-b { font-size: 14px; line-height: 1.75; color: var(--ab-dim); }

/* ── 채널 ───────────────────────────────────────────── */
.ab-chan { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 42px; }
.ab-chan-i { display: block; background: var(--ab-bg2); border: 1px solid var(--ab-line);
             border-radius: 16px; padding: 22px 24px; color: inherit; text-decoration: none;
             transition: border-color .3s, transform .3s; }
a.ab-chan-i:hover { border-color: var(--ab-accent); transform: translateY(-3px); }
.ab-chan-t { font-size: 16px; font-weight: 700; }
.ab-chan-b { font-size: 14px; color: var(--ab-dim); margin-top: 5px; }
.ab-chan-go { display: inline-block; font-size: 13px; font-weight: 600;
              color: var(--ab-accent); margin-top: 12px; }

/* ── 오시는 길 ──────────────────────────────────────── */
/* 네 곳을 두 줄로 나란히 둔다. 고객이 「우리 집에서 가까운 곳」 을 고르는
   자리라, 위아래로 길게 쌓아 두면 서로 비교하지 못하고 맨 위 것만 누른다.
   한 줄에 넷을 욱여넣지 않는 것은 주소가 길어서다 — 칸이 좁아지면 주소가
   석 줄로 접히고, 그때부터는 어느 것이 어느 지점인지 눈으로 못 가른다. */
.ab-places { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 42px; }
.ab-place { display: block; background: var(--ab-bg2); border: 1px solid var(--ab-line);
            border-radius: 16px; padding: 22px 24px; color: inherit; text-decoration: none;
            transition: border-color .3s, transform .3s; }
a.ab-place:hover { border-color: var(--ab-accent); transform: translateY(-3px); }
.ab-place-t { font-size: 16px; font-weight: 700; }
.ab-place-a { font-size: 14px; line-height: 1.7; color: var(--ab-dim); margin-top: 6px; }
.ab-place-go { display: inline-block; font-size: 13px; font-weight: 600;
               color: var(--ab-accent); margin-top: 12px; }

/* ── 아랫단 ─────────────────────────────────────────── */
.ab-info { display: block; max-width: 860px; margin-inline: auto;
           padding: 40px 24px 8px; border-top: 1px solid var(--ab-line); }
/* 항목을 가로로 잇되 좁은 화면에서는 줄이 바뀐다. 구분선(|)은 CSS 로 넣어
   시트에 기호를 적지 않게 한다 — 담당자가 값만 적으면 되어야 한다. */
.ab-info-line { display: flex; flex-wrap: wrap; gap: 6px 0; font-size: 13px;
                color: var(--ab-dim); line-height: 1.9; }
.ab-info-i + .ab-info-i::before { content: '|'; opacity: .4; margin: 0 10px; }
.ab-info-i b { font-weight: 600; color: var(--ab-fg); }
.ab-info-i a { color: var(--ab-accent); text-decoration: none; }
.ab-info-i a:hover { text-decoration: underline; }
.ab-info-c { font-size: 12px; color: var(--ab-dim); opacity: .7; margin: 16px 0 0; }

/* 공개 페이지에서는 직원에게만 하는 말을 감춘다(About.html 의 .ab-staff). */
.ab-public .ab-staff { display: none; }

/* 움직임을 줄이도록 설정한 사람에게는 그냥 보여 준다. 고객 앞에서 열리는
   화면이라, 효과가 꺼지면 내용까지 안 보이는 일이 있으면 안 된다. */
@media (prefers-reduced-motion: reduce) {
  .ab-up, .ab-w i { opacity: 1; transform: none; transition: none; }
  .ab-band-img { clip-path: none; transition: none; }
  .ab-cue, .ab-t-now::before { animation: none; }
  .ab-tile { opacity: 1; transform: none; transition: none; }
}

/* 고른 날 상자. 좁은 화면에서만 보인다(아래 미디어쿼리). */
.sc-day { display: none; margin-top: 10px; background: var(--surface);
          border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
.sc-day-h { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.sc-day-evs { display: flex; flex-direction: column; gap: 6px; }
.sc-day-none { font-size: 13px; color: var(--muted); }

/*
 * 폰에서 한 달을 한눈에.
 *
 * 660px 짜리 격자를 그대로 두면 일주일 중 서너 날만 보이고 나머지는 옆으로
 * 밀어야 한다. 가로로도 세로로도 미는 달력은 「이번 달이 어떤 달인가」 를
 * 보여주지 못한다 — 그게 이 화면의 쓸모인데.
 *
 * 그래서 칸을 화면 폭에 맞춰 줄이고, 그 안에서 제목을 포기한다. 한 칸이
 * 50px 이라 두 글자도 안 들어가고, 억지로 넣으면 「전체…」 같은 조각만
 * 남아 오히려 읽는 사람을 헷갈리게 한다. 칸에는 「무슨 종류가 있다」 까지만
 * 남기고(배지 글자 + 색 막대), 무엇인지는 날짜를 눌러 아래에서 본다.
 *
 * 경계는 660px — .mcal 의 min-width 와 같은 값이다. 그보다 좁으면 어차피
 * 옆으로 밀어야 하므로, 미는 대신 줄이는 편이 낫다.
 */
@media (max-width: 660px) {
  .mcal-wrap { overflow-x: visible; }
  .mcal { min-width: 0; gap: 4px; }

  .mcal .dow { font-size: 10px; letter-spacing: 0; padding: 5px 0; }
  .mcal .cell { min-height: 54px; padding: 4px 4px 5px; border-radius: 10px; }
  .mcal .cell .d { font-size: 12.5px; }
  .mcal .cell.today { box-shadow: inset 0 0 0 2px var(--accent), var(--shadow); }
  .mcal .cell.picked { box-shadow: inset 0 0 0 2px var(--text), var(--shadow); }

  /* 배지는 날짜와 같은 줄 오른쪽에. 19px 원은 좁은 칸에서 크다.
     아래로 내려 보았더니 날짜와 막대 사이에 끼어 칸이 세 층으로 보였다. */
  .mcal .cell .kind-dot {
    top: 4px; right: 4px; width: 14px; height: 14px;
    font-size: 8px; border-width: 1.2px;
  }

  /*
   * 칩을 색 막대로 줄인다. 글자를 감추는 것이 아니라 자리를 없앤다 —
   * 감추기만 하면 padding 이 남아 칸이 부풀고, 그러면 한 달이 또 넘친다.
   * 막대 수가 그날 일정 수라서 「두 개 있다」 까지는 칸에서 읽힌다.
   */
  .mcal .evs { margin-top: 3px; gap: 2px; }
  .mcal .evs .ev {
    font-size: 0; line-height: 0; padding: 0; height: 4px;
    border-radius: 2px; width: 100%;
  }
  .mcal .evs .ev .x { display: none; }

  .sc-day { display: block; }
}

@media (max-width: 760px) {
  .ab-sec { padding-block: 72px; }
  .ab-hero { min-height: 86vh; }
  .ab-cards, .ab-cards-3, .ab-chan, .ab-places { grid-template-columns: 1fr; }
  .ab-steps { grid-template-columns: repeat(2, 1fr); }
  .ab-nums { grid-template-columns: repeat(2, 1fr); gap: 34px 20px; }
  .ab-band { height: 44vh; }
}

.muted { color: var(--muted); }
.small { font-size: 13px; }
code { background: var(--surface-2); padding: 1px 6px; border-radius: 5px;
       font-size: 13px; word-break: break-all; }
</style>

        <p class="ab-eyebrow">03 &nbsp;상담 과정</p>
        <h2 class="ab-h ab-split">상담부터 완성까지, 이렇게 진행됩니다.</h2>
        <p class="ab-lead" id="ab-flow-lead"></p>
        <div class="ab-steps" id="ab-flow-list"></div>
      </section>

      <section class="ab-sec" id="ab-values">
        <p class="ab-eyebrow">04 &nbsp;일하는 기준</p>
        <h2 class="ab-h ab-split">홈루덴스가 일하는 기준.</h2>
        <p class="ab-lead" id="ab-values-lead"></p>
        <div class="ab-cards ab-cards-3" id="ab-values-list"></div>
      </section>

      <section class="ab-sec" id="ab-channels">
        <p class="ab-eyebrow">05 &nbsp;채널</p>
        <h2 class="ab-h ab-split">우리가 만드는 공간과 이야기를 공유합니다.</h2>
        <p class="ab-lead" id="ab-channels-lead"></p>
        <div class="ab-chan" id="ab-channels-list"></div>
      </section>

      <!--
        오시는 길이 맨 끝이다. 다 읽은 고객이 마지막으로 하는 일은 「그래서
        어디로 가면 되나」 이고, 그 답이 화면 밖(지도)으로 나가는 유일한 자리다.
      -->
      <section class="ab-sec" id="ab-map">
        <p class="ab-eyebrow">06 &nbsp;오시는 길</p>
        <h2 class="ab-h ab-split">서울과 부산에서 만나실 수 있습니다.</h2>
        <p class="ab-lead" id="ab-map-lead"></p>
        <div class="ab-places" id="ab-map-list"></div>
      </section>

      <!--
        아랫단. 홈페이지 맨 아래와 같은 줄이다 — 「이 회사가 실재하는가」 에
        번호로 답하는 자리라 화면 맨 끝에 둔다.
      -->
      <footer class="ab-info" id="ab-info"></footer>

      <!--
        직원에게만 하는 말이다. 공개 페이지(`?about=1`)에서는 body 에 붙는
        ab-public 이 이 줄을 감춘다 — 고객이 「운영본부에 말씀해 주세요」 를
        읽을 이유가 없다.
      -->
      <p class="ab-foot ab-staff small" style="color:var(--ab-dim)">
        이 화면은 고객께 그대로 보여 드려도 됩니다. 문구와 사진을 고쳐야 하면
        운영본부에 말씀해 주세요 — 콘텐츠 시트에서 바로 바뀝니다.
      </p>
    </div>

<script>
/*
 * 콘텐츠 시트의 `분류` 가 묶음이고, 한 묶음 안에서 **제목도 링크도 빈 줄이
 * 그 묶음의 머리말**이다. 이 규칙 하나로 「설명문 한 줄 + 항목 여러 개」 를
 * 시트에서 그대로 만들 수 있다.
 *
 * 링크까지 보는 이유는 사진 때문이다. 갤러리 사진은 제목이 없고 주소만 있다 —
 * 제목만 보고 갈랐더니 사진이 전부 머리말로 빨려 들어갔다.
 */
function abGroup(items, key) {
  var out = { lead: '', rows: [] };
  (items || []).forEach(function (c) {
    if ((c.category || '') !== key) return;
    var 제목없음 = !String(c.title || '').trim();
    var 링크없음 = !String(c.link || '').trim();
    if (제목없음 && 링크없음) out.lead = c.body || '';
    else out.rows.push(c);
  });
  return out;
}

/** 그 묶음의 첫 사진 주소. 없으면 빈 문자열 — 사진 자리는 어두운 면으로 남는다. */
function abPhoto(items, key) {
  var r = abGroup(items, key).rows[0];
  return r ? String(r.link || '') : '';
}

function renderAbout(items) {
  if (!items || !items.length) return;

  /*
   * 머리말. 사진 위에 문장 하나만 남는다 — 고객이 처음 보는 한 줄이다.
   *
   * 사진을 background-image 로 넣지 않고 <img> 로 넣는다. 주소가 죽었을 때
   * 알아챌 수 있어야 해서다(onerror). 배경으로 넣으면 실패가 조용하다.
   */
  var head = abGroup(items, '머리').rows[0];
  var heroPhoto = abPhoto(items, '사진-머리');
  document.getElementById('ab-hero').innerHTML =
    '<div class="ab-hero-bg">' +
      (heroPhoto ? '<img alt="" src="' + abEsc(heroPhoto) + '" ' +
                   'onerror="this.remove()">' : '') +
    '</div>' +
    '<div class="ab-hero-in">' +
      (head
        ? '<h1 class="ab-hero-t ab-split">' + abEsc(head.title) + '</h1>' +
          '<p class="ab-hero-s">' + abEsc(head.body) + '</p>'
        : '') +
      /*
       * 아래로 내려가라는 표시.
       *
       * 장식이 아니라 단추다. 누르면 실제로 다음 자리로 내려간다 — 화면이
       * 길어서 「여기가 끝인가」 하고 닫아 버리는 것이 이 화면에서 가장
       * 아까운 이탈이고, 표시만 그려 두고 눌리지 않으면 오히려 한 번 속인다.
       */
      abCueHtml() +
    '</div>';

  /*
   * 이름. 설명하지 않고 보여 준다.
   *
   * 이름 한 줄과 그 이름이 만드는 것 한 줄을 크게 두고, 뒷줄의 낱말 사이에
   * 실제로 만든 공간 사진을 끼워 넣는다. 사진이 글자와 같은 줄에서 같은 키로
   * 서므로, 읽는 눈이 글에서 사진으로 끊기지 않고 이어진다.
   *
   * 사진은 낱말 뒤에 하나씩 번갈아 넣는다 — 몇 번째에 넣을지 손으로 정해
   * 두면 문구가 한 글자만 바뀌어도 자리가 무너진다.
   *
   * 줄이 없으면 이 자리를 통째로 접는다. 빈 칸이 남으면 머리말과 01 사이에
   * 이유 없는 여백이 생긴다.
   */
  var name = abGroup(items, '이름').rows[0];
  var nameBox = document.getElementById('ab-name');
  if (name) {
    /*
     * 줄을 손으로 짠다. 본문의 줄바꿈이 화면의 줄바꿈이고 `[]` 가 사진 자리다.
     * 마지막 줄은 아래에 작게 깔리는 한글이다.
     *
     * 자동으로 흘려보내지 않는 이유는, 낱말과 사진이 어디서 끊기느냐가 이
     * 자리의 생김새 전부이기 때문이다. 맡겨 두면 창 폭에 따라 매번 다른
     * 그림이 나온다.
     *
     * 낱말마다 span 을 직접 만든다. abSplitWords 에 맡기면 사이에 끼운 사진을
     * 지우면서 다시 쓴다 — 실제로 그렇게 한 번 사라졌다.
     */
    var shots = abGroup(items, '사진-이름').rows;
    var lines = String(name.body || '').split('\n')
      .map(function (x) { return x.trim(); })
      .filter(Boolean);
    var sub = lines.pop() || '';

    /*
     * 줄마다 번호를 붙여 둔다(ab-nrow-1·2·3). 줄 하나만 자간을 달리 주고
     * 싶을 때 쓸 자리가 필요해서다 — 스타일이 몇째 줄인지 알 방법이 그것뿐이다.
     * 시트에서 줄을 더하거나 순서를 바꾸면 그 번호도 따라 옮겨간다.
     */
    var si = 0, seq = 0;
    var rows = lines.map(function (ln, li) {
      var cells = ln.split(/\s+/).filter(Boolean).map(function (tok) {
        var d = (seq++) * 55;
        if (tok !== '[]') {
          return '<span class="ab-w"><i style="--d:' + d + 'ms">' + abEsc(tok) + '</i></span>';
        }
        var shot = shots[si++];
        if (!shot || !shot.link) return '';
        return '<span class="ab-tile ab-up" style="--d:' + (d + 90) + 'ms">' +
          '<img alt="" src="' + abEsc(shot.link) +
          '" onerror="this.closest(\'.ab-tile\').remove()"></span>';
      });
      return '<span class="ab-nrow ab-nrow-' + (li + 1) + '">' +
             cells.join('') + '</span>';
    });

    nameBox.innerHTML =
      '<p class="ab-name-line ab-split">' + rows.join('') + '</p>' +
      (sub ? '<p class="ab-name-sub ab-up" style="--d:' + (seq * 55 + 160) + 'ms">' +
             abEsc(sub) + '</p>' : '');
    nameBox.querySelector('.ab-name-line').dataset.split = '1';
  } else {
    nameBox.style.display = 'none';
  }

  // 강점 — 고객이 가장 먼저 묻는 것에 먼저 답하는 자리.
  var why = abGroup(items, '강점');
  document.getElementById('ab-why-lead').textContent = why.lead;
  document.getElementById('ab-why-cards').innerHTML = why.rows.map(function (c, i) {
    return '<div class="ab-card ab-up" style="--d:' + (i * 90) + 'ms">' +
      '<div class="ab-card-n">' + abNo(i + 1) + '</div>' +
      '<div class="ab-card-t">' + abEsc(c.title) + '</div>' +
      '<div class="ab-card-b">' + abEsc(c.body) + '</div></div>';
  }).join('');

  // 사진 띠.
  var band = abPhoto(items, '사진-띠');
  document.getElementById('ab-band').innerHTML = band
    ? '<img class="ab-band-img" alt="" src="' + abEsc(band) + '" onerror="this.remove()">'
    : '';

  /*
   * 연혁 — 본문 첫 줄이 그해의 한 줄 요약이고, 그 아래가 항목이다.
   * 항목 순서를 손대지 말 것. 조직·시스템이 먼저 오고 매출이 마지막이다.
   */
  var his = abGroup(items, '연혁');
  document.getElementById('ab-history-lead').textContent = his.lead;
  document.getElementById('ab-history-list').innerHTML = his.rows.map(function (c, i) {
    var t = String(c.title || '').trim().split(/\s+/);
    var year = t.shift() || '';
    var tag = t.join(' ');
    var lines = String(c.body || '').split('\n').filter(function (x) { return x.trim(); });
    var sum = lines.shift() || '';
    var last = i === his.rows.length - 1;
    return '<div class="ab-t-row ab-up' + (last ? ' ab-t-now' : '') + '">' +
      '<div class="ab-t-year">' + abEsc(year) +
        (tag ? '<span class="ab-t-tag">' + abEsc(tag) + '</span>' : '') + '</div>' +
      '<div class="ab-t-body">' +
        '<div class="ab-t-sum">' + abEsc(sum) + '</div>' +
        '<ul class="ab-t-list">' + lines.map(function (x) {
          return '<li>' + abEsc(x.trim()) + '</li>';
        }).join('') + '</ul>' +
      '</div></div>';
  }).join('');

  // 숫자 — 연혁을 다 읽은 다음에 나오는 마침표.
  var nums = abGroup(items, '숫자');
  document.getElementById('ab-nums').innerHTML = nums.rows.map(function (c, i) {
    return '<div class="ab-num ab-up" style="--d:' + (i * 110) + 'ms">' +
      '<div class="ab-num-v" data-v="' + abEsc(c.title) + '">' + abEsc(c.title) + '</div>' +
      '<div class="ab-num-l">' + abEsc(c.body) + '</div></div>';
  }).join('');

  // 상담 과정.
  var flow = abGroup(items, '과정');
  document.getElementById('ab-flow-lead').textContent = flow.lead;
  document.getElementById('ab-flow-list').innerHTML = flow.rows.map(function (c, i) {
    return '<div class="ab-step ab-up" style="--d:' + (i * 70) + 'ms">' +
      '<div class="ab-step-n">' + abNo(i + 1) + '</div>' +
      '<div class="ab-step-t">' + abEsc(c.title) + '</div>' +
      '<div class="ab-step-b">' + abEsc(c.body) + '</div></div>';
  }).join('');

  // 일하는 기준.
  var val = abGroup(items, '가치');
  document.getElementById('ab-values-lead').textContent = val.lead;
  document.getElementById('ab-values-list').innerHTML = val.rows.map(function (c, i) {
    return '<div class="ab-card ab-up" style="--d:' + (i * 90) + 'ms">' +
      '<div class="ab-card-t">' + abEsc(c.title) + '</div>' +
      '<div class="ab-card-b">' + abEsc(c.body) + '</div></div>';
  }).join('');

  /*
   * 채널 — 링크 칸이 빈 줄은 이름만 보이고 눌리지 않는다. 주소를 모르는 채널에
   * 그럴듯한 주소를 지어 넣으면, 고객 앞에서 누른 순간 엉뚱한 곳이 열린다.
   */
  var chan = abGroup(items, '채널');
  document.getElementById('ab-channels-lead').textContent = chan.lead;
  document.getElementById('ab-channels-list').innerHTML = chan.rows.map(function (c, i) {
    var inner = '<div class="ab-chan-t">' + abEsc(c.title) + '</div>' +
                '<div class="ab-chan-b">' + abEsc(c.body) + '</div>';
    var st = ' class="ab-chan-i ab-up" style="--d:' + (i * 80) + 'ms"';
    return c.link
      ? '<a href="' + abEsc(c.link) + '" target="_blank" rel="noopener"' + st + '>' + inner +
        '<span class="ab-chan-go">열기 ↗</span></a>'
      : '<div' + st + '>' + inner + '</div>';
  }).join('');

  /*
   * 오시는 길. 누르면 네이버 지도가 열린다.
   *
   * 지도 주소가 없는 줄은 눌리지 않는다 — 채널과 같은 규칙이다. 고객 앞에서
   * 누른 링크가 엉뚱한 곳으로 가는 것보다 안 눌리는 편이 낫다.
   */
  var map = abGroup(items, '오시는길');
  document.getElementById('ab-map-lead').textContent = map.lead;
  document.getElementById('ab-map-list').innerHTML = map.rows.map(function (c, i) {
    var inner = '<div class="ab-place-t">' + abEsc(c.title) + '</div>' +
                '<div class="ab-place-a">' + abEsc(c.body) + '</div>';
    var st = ' class="ab-place ab-up" style="--d:' + (i * 80) + 'ms"';
    return c.link
      ? '<a href="' + abEsc(c.link) + '" target="_blank" rel="noopener"' + st + '>' + inner +
        '<span class="ab-place-go">네이버 지도 →</span></a>'
      : '<div' + st + '>' + inner + '</div>';
  }).join('');

  /*
   * 아랫단. 링크 칸이 있으면 누를 수 있게 한다(대표전화 tel:).
   * 홈페이지처럼 「이름 : 값」 을 가로로 잇고, 좁은 화면에서는 줄바꿈된다.
   */
  var info = abGroup(items, '아랫단');
  document.getElementById('ab-info').innerHTML =
    '<div class="ab-info-line">' + info.rows.map(function (c) {
      var v = c.link
        ? '<a href="' + abEsc(c.link) + '">' + abEsc(c.body) + '</a>'
        : abEsc(c.body);
      return '<span class="ab-info-i"><b>' + abEsc(c.title) + '</b> ' + v + '</span>';
    }).join('') + '</div>' +
    (info.lead ? '<p class="ab-info-c">' + abEsc(info.lead) + '</p>' : '');

  abSplitWords();
}

/*
 * 아래로 내려가라는 표시.
 *
 * 동그라미 안의 화살표와 SCROLL. 원은 어떤 사진 위에 얹혀도 형태가 남고,
 * 화살표는 방향을 말한다. 한때 원을 따라 도는 글자로 바꿨다가 되돌렸다 —
 * 첫 화면에서 도는 것이 하나 있으면 시선이 그리로 끌려가서, 정작 읽어야 할
 * 문장이 뒤로 밀린다.
 *
 * 장식이 아니라 단추다. 누르면 실제로 다음 자리로 내려간다 — 화면이 길어서
 * 「여기가 끝인가」 하고 닫아 버리는 것이 이 화면에서 가장 아까운 이탈이고,
 * 표시만 그려 두고 눌리지 않으면 오히려 한 번 속인다.
 */
function abCueHtml() {
  return '<button class="ab-cue" type="button" onclick="abScrollNext()" ' +
         'aria-label="아래로 내려가기">' +
           '<span class="ab-cue-ring"><i></i></span>' +
           '<span class="ab-cue-label">SCROLL</span>' +
         '</button>';
}

/*
 * 머리말 다음 자리로 내려간다.
 *
 * 높이를 숫자로 적지 않고 실제 요소를 찾아 간다 — 히어로 높이(92vh)를 적어
 * 두면 창 크기나 섹션이 바뀔 때마다 엉뚱한 데 선다.
 */
function abScrollNext() {
  var hero = document.getElementById('ab-hero');
  var next = hero && hero.nextElementSibling;
  while (next && next.offsetParent === null) next = next.nextElementSibling;
  if (next) next.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/** 01·02… 두 자리로 맞춘다. 한 자리와 두 자리가 섞이면 줄이 흔들린다. */
function abNo(n) { return (n < 10 ? '0' : '') + n; }

/*
 * 큰 제목을 단어로 쪼갠다. 단어가 차례로 올라오면 문장이 읽히는 속도와
 * 나타나는 속도가 얼추 맞아서, 읽는 사람이 기다리지 않는다.
 *
 * 글자 단위로 쪼개지 않는 이유는 한글이다 — 낱자가 하나씩 튀어오르면
 * 읽기 전에 눈이 먼저 피로해지고, 줄바꿈이 단어 가운데서 일어난다.
 */
function abSplitWords() {
  var hs = document.querySelectorAll('.ab .ab-split');
  for (var i = 0; i < hs.length; i++) {
    var el = hs[i];
    if (el.dataset.split) continue;
    el.dataset.split = '1';
    var words = el.textContent.split(/(\s+)/);
    var html = '';
    var n = 0;
    words.forEach(function (w) {
      if (!w.trim()) { html += w; return; }
      html += '<span class="ab-w"><i style="--d:' + (n * 55) + 'ms">' + abEsc(w) + '</i></span>';
      n++;
    });
    el.innerHTML = html;
  }
}

/*
 * 스크롤에 맞춰 하나씩 올라오게 한다.
 *
 * 화면이 숨어 있는 동안에는 아무것도 보이지 않으므로 관찰자가 켜져 있어도
 * 올라오지 않는다. go('about') 에서 화면을 켠 뒤에 불러야 한다.
 *
 * 움직임을 줄이도록 설정한 사람에게는 애니메이션 없이 그냥 보여 준다 —
 * 이 화면은 고객 앞에서 열리므로, 누가 보든 내용은 다 보여야 한다.
 */
var AB_OBS = null;
function abReveal() {
  var els = document.querySelectorAll('.ab .ab-up, .ab .ab-split, .ab .ab-band-img');
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still || !window.IntersectionObserver) {
    for (var i = 0; i < els.length; i++) els[i].classList.add('on');
    abCount(true);
    return;
  }
  if (!AB_OBS) {
    AB_OBS = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('on');
        AB_OBS.unobserve(e.target);
        if (e.target.querySelector && e.target.querySelector('.ab-num-v')) abCount(false);
      });
    }, { rootMargin: '0px 0px -10% 0px', threshold: 0.12 });
  }
  for (var j = 0; j < els.length; j++) {
    if (!els[j].classList.contains('on')) AB_OBS.observe(els[j]);
  }
  abScrollBind();
}

/*
 * 스크롤을 따라 움직이는 것들 — 머리 사진과 띠 사진, 그리고 위의 진행 막대.
 *
 * rAF 로 묶어서 한 프레임에 한 번만 잰다. scroll 마다 바로 재면 폭·높이를
 * 묻는 순간 브라우저가 레이아웃을 다시 계산해서, 스크롤이 끈적해진다.
 */
var AB_BOUND = false;
function abScrollBind() {
  if (AB_BOUND) return;
  AB_BOUND = true;
  var ticking = false;
  var tick = function () {
    ticking = false;
    abParallax();
  };
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(tick);
  }, { passive: true });
  abParallax();
}

function abParallax() {
  var wrap = document.querySelector('.ab');
  if (!wrap || !wrap.offsetParent) return;      // 숨어 있으면 잴 것이 없다

  var vh = window.innerHeight || 1;

  // 머리 사진은 스크롤보다 느리게 내려가고 아주 조금 커진다.
  var hero = document.querySelector('.ab-hero-bg img');
  if (hero) {
    var top = hero.closest('.ab-hero').getBoundingClientRect().top;
    var p = Math.min(1, Math.max(0, -top / vh));
    hero.style.transform = 'translate3d(0,' + (p * 14) + '%,0) scale(' + (1 + p * 0.12) + ')';
    hero.style.opacity = String(1 - p * 0.45);
  }

  // 띠 사진도 같은 방식. 화면 안에 있을 때만 움직인다.
  var band = document.querySelector('.ab-band-img');
  if (band) {
    var r = band.getBoundingClientRect();
    if (r.bottom > 0 && r.top < vh) {
      var q = (vh - r.top) / (vh + r.height);      // 0 → 1
      band.style.transform = 'translate3d(0,' + ((q - 0.5) * -12) + '%,0) scale(1.14)';
    }
  }

  // 진행 막대. 이 화면 안에서의 진행이지 문서 전체가 아니다.
  var bar = document.getElementById('ab-rail-bar');
  if (bar) {
    var b = wrap.getBoundingClientRect();
    var done = Math.min(1, Math.max(0, -b.top / Math.max(1, b.height - vh)));
    bar.style.transform = 'scaleX(' + done + ')';
  }
}

/*
 * 숫자가 0 에서 올라오게 한다. 연도(2018년)는 세지 않는다 — 0 부터 2018 까지
 * 올라가는 연도는 숫자가 아니라 고장으로 보인다.
 */
function abCount(instant) {
  var els = document.querySelectorAll('.ab .ab-num-v');
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    if (el.dataset.done) continue;
    el.dataset.done = '1';
    var raw = el.dataset.v || '';
    var m = raw.match(/^([\d,]+)(.*)$/);
    if (!m || instant) continue;
    var target = Number(m[1].replace(/,/g, ''));
    if (!target || /^\d{4}년/.test(raw)) continue;
    abTick(el, target, m[2], Date.now());
  }
}

function abTick(el, target, suffix, t0) {
  var p = Math.min(1, (Date.now() - t0) / 1100);
  var eased = 1 - Math.pow(1 - p, 3);
  el.textContent = Math.round(target * eased).toLocaleString('ko-KR') + suffix;
  if (p < 1) requestAnimationFrame(function () { abTick(el, target, suffix, t0); });
}

/** 글자를 그대로 넣는다. 포털의 esc() 와 이름을 겹치지 않게 둔다 —
    이 파일은 포털 없이도 혼자 도는 페이지에서 쓰인다. */
function abEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
